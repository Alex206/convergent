name: Publish Convergent 0.2.0

on:
  push:
    branches:
      - agent/0.2-convergence-efficiency
    paths:
      - .github/workflows/release-0.2.0.yml

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 715dbab94d3b8a561d3f78189d6703f981690877
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Build Linux x64 VSIX
        run: npm run package -- --out "${{ runner.temp }}/convergent-0.2.0-linux-x64.vsix"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64
          path: ${{ runner.temp }}/convergent-0.2.0-linux-x64.vsix
          if-no-files-found: error
          retention-days: 7

  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 715dbab94d3b8a561d3f78189d6703f981690877
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Build Windows x64 VSIX
        shell: pwsh
        run: npm run package -- --out "$env:RUNNER_TEMP/convergent-0.2.0-win32-x64.vsix"
      - uses: actions/upload-artifact@v4
        with:
          name: release-win32-x64
          path: ${{ runner.temp }}/convergent-0.2.0-win32-x64.vsix
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: 715dbab94d3b8a561d3f78189d6703f981690877
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          test -f release-assets/convergent-0.2.0-linux-x64.vsix
          test -f release-assets/convergent-0.2.0-win32-x64.vsix
      - name: Write release notes
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          # Convergent 0.2.0

          Convergent 0.2.0 is the first robust release of the VS Code / GitHub Copilot SDK multi-agent orchestrator.

          Highlights:
          - persistent strong coordinator with acceptance-boundary planning and deterministic route/risk enforcement;
          - exact-fingerprint Worker A / Worker B convergence followed by a required strong reviewer;
          - deterministic task-change manifests and bounded `batch_view` handoffs;
          - protected pre-existing dirty, staged, untracked, and ignored workspace state;
          - structured BLOCKED recovery through a fresh strong recovery coordinator, including operator-controlled token/credential prerequisites;
          - `/fast`, `/auto`, and `/thorough` execution profiles without weakening strong-role safety;
          - resume checkpoints, live steering, event-driven stall watchdogs, and trajectory audits;
          - bounded headless benchmark harness with explicit-model preflight, quota fuses, offline efficiency analysis, and deterministic Scenario 03/04/05 acceptance oracles;
          - reproducible `npm ci` installs and platform-specific VSIX packaging for Linux x64 and Windows x64.

          Release validation used explicit Copilot Pro models and passed:
          - Scenario 03 dependency ordering: 12/12 oracle, 19 model calls, ~69 s;
          - Scenario 04 BLOCKED recovery: full workspace/recovery oracle, 25 model calls, ~74 s;
          - Scenario 05 protected workspace state: full oracle, 17 model calls, ~42 s;
          - final CI: 191/191 tests on Linux and 191/191 tests on Windows, `npm run check` green, 0 npm vulnerabilities.

          The attached VSIX files are platform-specific because the Copilot SDK contains native/runtime dependencies. Install the asset matching the host platform.

          Deferred to later milestones include the Convergent-owned `run_command` process lifecycle contract (0.3) and production headless/multi-frontend service integrations.
          EOF
      - name: Create GitHub release and tag
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.2.0 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo 'v0.2.0 already exists; refusing to move or overwrite an existing release.' >&2
            exit 2
          fi
          gh release create v0.2.0 \
            release-assets/convergent-0.2.0-linux-x64.vsix \
            release-assets/convergent-0.2.0-win32-x64.vsix \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${TARGET_SHA}" \
            --title 'Convergent 0.2.0' \
            --notes-file release-notes.md \
            --verify-tag=false
