name: Headless Auto Smoke

on:
  pull_request:
    types:
      - labeled

jobs:
  smoke:
    if: github.event.label.name == 'headless-auto-smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      COPILOT_PLUGIN_DIR_ONLY: 'true'
      CONVERGENT_HEADLESS_ANSWERS_JSON: '[]'
      SMOKE_OUTPUT: ${{ runner.temp }}/convergent-auto-smoke
    steps:
      - name: Require smoke credentials
        shell: bash
        env:
          BENCHMARK_REPO_TOKEN: ${{ secrets.BENCHMARK_REPO_TOKEN }}
        run: |
          if [[ -z "${COPILOT_GITHUB_TOKEN}" ]]; then
            echo "COPILOT_GITHUB_TOKEN is required for the bounded auto smoke." >&2
            exit 2
          fi
          if [[ -z "${BENCHMARK_REPO_TOKEN}" ]]; then
            echo "BENCHMARK_REPO_TOKEN is required with read-only Contents access to Alex206/convergent-test-repo." >&2
            exit 2
          fi

      - name: Checkout Convergent
        uses: actions/checkout@v6

      - name: Checkout benchmark target
        uses: actions/checkout@v6
        with:
          repository: Alex206/convergent-test-repo
          ref: main
          path: benchmark-target
          token: ${{ secrets.BENCHMARK_REPO_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install locked Convergent dependencies
        run: npm ci

      - name: Record exact runtime versions
        shell: bash
        run: |
          mkdir -p "${SMOKE_OUTPUT}"
          node - <<'NODE' > "${SMOKE_OUTPUT}/runtime-versions.json"
          const { runtimeVersionInfo } = require('./src/copilot/version-info');
          process.stdout.write(`${JSON.stringify(runtimeVersionInfo(), null, 2)}\n`);
          NODE

      - name: Run bounded auto diagnostic on Scenario 03
        id: smoke
        timeout-minutes: 6
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "${SMOKE_OUTPUT}"
          echo "NON-AUTHORITATIVE DIAGNOSTIC: every role intentionally uses Copilot auto." | tee "${SMOKE_OUTPUT}/diagnostic-scope.txt"
          node src/headless/cli.js \
            --workspace "${GITHUB_WORKSPACE}/benchmark-target" \
            --prompt-file "${GITHUB_WORKSPACE}/benchmark-target/benchmarks/03-dependency-ordering.md" \
            --output-dir "${SMOKE_OUTPUT}" \
            --flow fast \
            --coordinator auto \
            --worker-a auto \
            --worker-b auto \
            --reviewer auto \
            --audit-level full \
            --limit-policy pause \
            --max-model-calls 12 \
            --max-model-calls-per-turn 5 \
            --max-chat-requests 5 \
            --max-ai-credits 6 \
            2>&1 | tee "${SMOKE_OUTPUT}/runner.log"

      - name: Summarize smoke efficiency
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p "${SMOKE_OUTPUT}"
          events="$(find "${SMOKE_OUTPUT}/audit" -name events.jsonl -type f 2>/dev/null | head -n 1)"
          if [[ -n "${events}" ]]; then
            node src/headless/efficiency-summary.js "${events}" "${SMOKE_OUTPUT}/efficiency-summary.json" > "${SMOKE_OUTPUT}/efficiency-summary.log"
          else
            echo "No trajectory events available." > "${SMOKE_OUTPUT}/efficiency-summary.log"
          fi

      - name: Independently validate target
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p "${SMOKE_OUTPUT}"
          set -o pipefail
          (
            cd benchmark-target
            python3 -B -m unittest discover -s tests -v
          ) 2>&1 | tee "${SMOKE_OUTPUT}/target-validation.log"

      - name: Capture final target workspace
        if: always()
        shell: bash
        run: |
          mkdir -p "${SMOKE_OUTPUT}"
          git -C benchmark-target status --porcelain=v1 --untracked-files=all > "${SMOKE_OUTPUT}/final-status.txt" || true
          git -C benchmark-target diff --binary --no-ext-diff > "${SMOKE_OUTPUT}/final-diff.patch" || true
          tar --exclude=.git -czf "${SMOKE_OUTPUT}/workspace.tar.gz" -C benchmark-target .

      - name: Upload auto-smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: convergent-auto-smoke-${{ github.run_number }}
          path: ${{ runner.temp }}/convergent-auto-smoke
          if-no-files-found: warn
          retention-days: 7
