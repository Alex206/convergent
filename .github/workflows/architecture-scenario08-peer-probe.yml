name: Temporary Scenario 08 Peer Probe

on:
  pull_request:
    types:
      - synchronize

jobs:
  peer:
    if: github.event.pull_request.head.ref == 'agent/architecture-benchmark-matrix'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    env:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      COPILOT_PLUGIN_DIR_ONLY: 'true'
      BENCHMARK_REPO_TOKEN: ${{ secrets.BENCHMARK_REPO_TOKEN }}
      TARGET_SHA: 25de9ede2ea17e8e7e212ce057ff8e378fa81264
      OUTPUT_ROOT: /tmp/scenario08-peer
      CONVERGENT_HEADLESS_ANSWERS_JSON: '[]'
    steps:
      - name: Require benchmark credentials
        shell: bash
        run: |
          test -n "${COPILOT_GITHUB_TOKEN}" || exit 2
          test -n "${BENCHMARK_REPO_TOKEN}" || exit 2

      - name: Checkout Convergent
        uses: actions/checkout@v6

      - name: Checkout Scenario 08 fixture
        uses: actions/checkout@v6
        with:
          repository: Alex206/convergent-test-repo
          ref: ${{ env.TARGET_SHA }}
          path: target-peer
          token: ${{ secrets.BENCHMARK_REPO_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run Luna plus peer convergence plus Terra reviewer
        id: peer
        continue-on-error: true
        timeout-minutes: 8
        shell: bash
        run: |
          mkdir -p "${OUTPUT_ROOT}"
          set +e
          node src/headless/architecture-cli.js \
            --workspace "${GITHUB_WORKSPACE}/target-peer" \
            --prompt-file "${GITHUB_WORKSPACE}/target-peer/benchmarks/08-artifact-path-containment.md" \
            --output-dir "${OUTPUT_ROOT}" \
            --architecture peer-competition-reviewer \
            --recovery-policy none \
            --flow fast \
            --worker-a balanced-a \
            --worker-b balanced-b \
            --reviewer strong \
            --experimental-route high_risk \
            --experimental-risk high \
            --audit-level full \
            --limit-policy pause \
            --max-model-calls 46 \
            --max-model-calls-per-turn 10 \
            --max-chat-requests 14 \
            --max-ai-credits 0 \
            2>&1 | tee "${OUTPUT_ROOT}/runner.log"
          code=${PIPESTATUS[0]}
          printf '{"runExit":%s}\n' "${code}" > "${OUTPUT_ROOT}/arm-status.json"
          exit "${code}"

      - name: Run independent security oracle
        if: always()
        shell: bash
        env:
          TARGET: ${{ github.workspace }}/target-peer
          OUTPUT: /tmp/scenario08-peer/scenario08-acceptance.json
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          root = os.environ['TARGET']
          probe = r'''
          import json, tempfile, sys
          from pathlib import Path
          from taskflow import resolve_artifact_path
          result = {"checks": []}
          def check(name, fn):
              try:
                  fn(); result["checks"].append({"name": name, "ok": True})
              except Exception as exc:
                  result["checks"].append({"name": name, "ok": False, "error": f"{type(exc).__name__}: {exc}"})
          def reject(root, value):
              try: resolve_artifact_path(root, value)
              except ValueError: return
              raise AssertionError(f"expected ValueError for {value!r}")
          with tempfile.TemporaryDirectory() as tmp:
              base = Path(tmp); artifact_root = base / "work"; prefix_sibling = base / "work-shadow"; outside = base / "outside"
              artifact_root.mkdir(); prefix_sibling.mkdir(); outside.mkdir(); nested = artifact_root / "reports"; nested.mkdir()
              def happy_and_canonical():
                  assert resolve_artifact_path(artifact_root, "reports/../result.json") == (artifact_root / "result.json").resolve()
                  assert resolve_artifact_path(artifact_root, "reports/data.json") == (nested / "data.json").resolve()
              def sibling_prefix_escape():
                  reject(artifact_root, "../work-shadow/leak.txt"); reject(artifact_root, "../outside/leak.txt")
              def absolute_paths():
                  reject(artifact_root, str((artifact_root / "inside.txt").resolve())); reject(artifact_root, str((outside / "outside.txt").resolve()))
              def strict_descendant():
                  for value in (".", "reports/..", "./reports/../."): reject(artifact_root, value)
              def invalid_values():
                  for value in ("", None, 7): reject(artifact_root, value)
              def symlink_boundary():
                  inside_dir = artifact_root / "inside-target"; inside_dir.mkdir()
                  inside_link = artifact_root / "inside-link"; outside_link = artifact_root / "outside-link"; prefix_link = artifact_root / "prefix-link"
                  try:
                      inside_link.symlink_to(inside_dir, target_is_directory=True); outside_link.symlink_to(outside, target_is_directory=True); prefix_link.symlink_to(prefix_sibling, target_is_directory=True)
                  except (OSError, NotImplementedError): return
                  assert resolve_artifact_path(artifact_root, "inside-link/ok.txt") == (inside_dir / "ok.txt").resolve()
                  reject(artifact_root, "outside-link/escape.txt"); reject(artifact_root, "prefix-link/escape.txt")
              check("valid and normalized in-root paths resolve canonically", happy_and_canonical)
              check("parent and sibling-prefix traversal are rejected", sibling_prefix_escape)
              check("absolute paths are rejected even when inside root", absolute_paths)
              check("resolved root itself is rejected; result must be a strict descendant", strict_descendant)
              check("empty and non-string artifact paths preserve ValueError contract", invalid_values)
              check("symlinks may resolve inside root but cannot escape it", symlink_boundary)
          result["ok"] = all(c["ok"] for c in result["checks"])
          print(json.dumps(result)); sys.exit(0 if result["ok"] else 1)
          '''
          completed = subprocess.run([sys.executable, '-B', '-c', probe], cwd=root, text=True, capture_output=True)
          try: behavior = json.loads(completed.stdout.strip() or '{}')
          except Exception: behavior = {"ok": False, "checks": [], "parseError": completed.stdout, "stderr": completed.stderr}
          tests = subprocess.run([sys.executable, '-B', '-m', 'unittest', 'discover', '-s', 'tests', '-v'], cwd=root, text=True, capture_output=True)
          report = {"ok": bool(behavior.get("ok")) and tests.returncode == 0, "behavior": behavior, "unitTestsExit": tests.returncode, "unitTestsTail": (tests.stdout + tests.stderr)[-6000:]}
          with open(os.environ['OUTPUT'], 'w', encoding='utf8') as f: json.dump(report, f, indent=2); f.write('\n')
          print(json.dumps(report, indent=2))
          PY
          events="$(find "${OUTPUT_ROOT}/audit" -name events.jsonl -type f 2>/dev/null | head -n 1)"
          if [[ -n "${events}" ]]; then
            node src/headless/efficiency-summary.js "${events}" "${OUTPUT_ROOT}/efficiency-summary.json" > "${OUTPUT_ROOT}/efficiency-summary.log" 2>&1 || true
          fi

      - name: Upload peer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario08-peer-${{ github.run_number }}
          path: /tmp/scenario08-peer
          if-no-files-found: error
          retention-days: 14

      - name: Require completed peer and green oracle
        if: always()
        shell: bash
        run: |
          ROOT="${OUTPUT_ROOT}" node - <<'NODE'
          const fs = require('node:fs'); const path = require('node:path'); const root = process.env.ROOT;
          const result = JSON.parse(fs.readFileSync(path.join(root, 'result.json'), 'utf8'));
          const acceptance = JSON.parse(fs.readFileSync(path.join(root, 'scenario08-acceptance.json'), 'utf8'));
          console.log(`peer: status=${result.status} oracle=${acceptance.ok} calls=${result.usage?.calls} credits=${result.usage?.aiCredits} input=${result.usage?.inputTokens} elapsedMs=${result.usage?.elapsedMs}`);
          if (result.status !== 'complete' || acceptance.ok !== true) process.exit(1);
          NODE
