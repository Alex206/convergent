name: Reviewer Historical CI V6B

on:
  workflow_dispatch:
  push:
    branches:
      - agent/perspective-review-protocol-benchmark

jobs:
  benchmark:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[reviewer-v6b-run]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      COPILOT_PLUGIN_DIR_ONLY: 'true'
    steps:
      - name: Require benchmark credentials
        shell: bash
        run: |
          test -n "${COPILOT_GITHUB_TOKEN}" || { echo "COPILOT_GITHUB_TOKEN is required." >&2; exit 2; }

      - name: Initialize run root
        shell: bash
        run: echo "RUN_ROOT=${RUNNER_TEMP}/reviewer-v6b" >> "${GITHUB_ENV}"

      - name: Checkout benchmark harness
        uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate benchmark framework
        shell: bash
        run: |
          npm ci
          npm test
          npm run check

      - name: Checkout historical PR23 defective snapshot
        uses: actions/checkout@v6
        with:
          repository: Alex206/convergent
          ref: 6d63a9e9e08d0c4199b9e885e08e0ceb14fff6f5
          path: benchmark-targets/h23-defect

      - name: Checkout historical PR23 fixed snapshot
        uses: actions/checkout@v6
        with:
          repository: Alex206/convergent
          ref: 37704de69833e77b992e8af0e00e2219d648656d
          path: benchmark-targets/h23-fixed

      - name: Install historical target dependencies
        shell: bash
        run: |
          npm ci --prefix benchmark-targets/h23-defect
          npm ci --prefix benchmark-targets/h23-fixed

      - name: Validate frozen targets and exact ground truth
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUN_ROOT}/validation"
          node src/headless/reviewer-v6b-case-validation.js \
            v6b-h23-ci-oracle-gate-regression \
            "${GITHUB_WORKSPACE}/benchmark-targets/h23-defect" \
            "${RUN_ROOT}/validation/v6b-h23-ci-oracle-gate-regression.json"
          node src/headless/reviewer-v6b-case-validation.js \
            v6b-h23-ci-oracle-gate-fixed \
            "${GITHUB_WORKSPACE}/benchmark-targets/h23-fixed" \
            "${RUN_ROOT}/validation/v6b-h23-ci-oracle-gate-fixed.json"

      - name: Run R2 and R3 reviewer cases sequentially
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "${RUN_ROOT}/runs"
          failures=0
          cases=(
            'v6b-h23-ci-oracle-gate-regression|benchmark-targets/h23-defect'
            'v6b-h23-ci-oracle-gate-fixed|benchmark-targets/h23-fixed'
          )
          prompt="$(cat "${GITHUB_WORKSPACE}/benchmarks/reviewer-v6b-pr23-ci-gate.md")"
          for arm in luna-broad-3 luna-specialized-3; do
            for entry in "${cases[@]}"; do
              IFS='|' read -r case_id target <<<"${entry}"
              out="${RUN_ROOT}/runs/${arm}/${case_id}"
              rm -rf "${out}"
              mkdir -p "${out}"
              fixture_sha="$(git -C "${target}" rev-parse HEAD)"
              RUN_OUTPUT="${out}" CASE_ID="${case_id}" ARM="${arm}" FIXTURE_SHA="${fixture_sha}" TARGET="${target}" node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          fs.writeFileSync(path.join(process.env.RUN_OUTPUT, 'benchmark-meta.json'), `${JSON.stringify({
            caseId: process.env.CASE_ID,
            fixtureRef: process.env.FIXTURE_SHA,
            fixtureSha: process.env.FIXTURE_SHA,
            arm: process.env.ARM,
            repeat: 1,
            target: process.env.TARGET,
          }, null, 2)}\n`);
          NODE
              echo "== ${arm} · ${case_id} · ${fixture_sha} =="
              export CONVERGENT_HEADLESS_ANSWERS_JSON='[]'
              if node src/headless/reviewer-only-cli.js \
                --workspace "${GITHUB_WORKSPACE}/${target}" \
                --prompt "${prompt}" \
                --output-dir "${out}" \
                --arm "${arm}" \
                --flow auto \
                --audit-level full \
                --limit-policy continue \
                --max-model-calls 60 \
                --max-model-calls-per-turn 18 \
                --max-chat-requests 36 \
                --max-ai-credits 80; then
                rc=0
              else
                rc=$?
              fi
              if [ "${rc}" -ne 0 ]; then
                echo "Cell failed: ${arm} ${case_id} (rc=${rc})" >&2
                failures=$((failures + 1))
              fi
              dirty="$(git -C "${target}" status --porcelain=v1 --untracked-files=all)"
              if [ -n "${dirty}" ]; then
                echo "Reviewer changed frozen workspace: ${arm} ${case_id}" >&2
                printf '%s\n' "${dirty}" >&2
                failures=$((failures + 1))
              fi
            done
          done
          printf '%s\n' "${failures}" > "${RUN_ROOT}/cell-failures.txt"

      - name: Build V6B report
        if: always()
        shell: bash
        run: |
          node src/headless/reviewer-v6b-report.js \
            "${RUN_ROOT}/runs" \
            "${RUN_ROOT}/reviewer-v6b-report.json" \
            "${RUN_ROOT}/reviewer-v6b-report.md"
          cat "${RUN_ROOT}/reviewer-v6b-report.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload V6B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewer-v6b-${{ github.run_number }}
          path: ${{ runner.temp }}/reviewer-v6b
          if-no-files-found: error
          retention-days: 30

      - name: Fail on incomplete reviewer cells
        if: always()
        shell: bash
        run: |
          failures="$(cat "${RUN_ROOT}/cell-failures.txt" 2>/dev/null || echo 999)"
          test "${failures}" = "0" || { echo "${failures} reviewer cell(s) failed." >&2; exit 1; }
