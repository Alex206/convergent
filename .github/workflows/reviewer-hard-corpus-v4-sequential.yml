name: Reviewer Hard Corpus V4 Sequential

on:
  workflow_dispatch:
  push:
    branches:
      - agent/perspective-review-protocol-benchmark

jobs:
  benchmark:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[reviewer-v4-seq-run]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      COPILOT_PLUGIN_DIR_ONLY: 'true'
    steps:
      - name: Require benchmark credentials
        shell: bash
        env:
          BENCHMARK_REPO_TOKEN: ${{ secrets.BENCHMARK_REPO_TOKEN }}
        run: |
          test -n "${COPILOT_GITHUB_TOKEN}" || { echo "COPILOT_GITHUB_TOKEN is required." >&2; exit 2; }
          test -n "${BENCHMARK_REPO_TOKEN}" || { echo "BENCHMARK_REPO_TOKEN is required." >&2; exit 2; }

      - name: Initialize run root
        shell: bash
        run: echo "RUN_ROOT=${RUNNER_TEMP}/reviewer-v4-sequential" >> "${GITHUB_ENV}"

      - name: Checkout Convergent
        uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate framework
        shell: bash
        run: |
          npm ci
          npm test
          npm run check

      - name: Checkout S15 defective
        uses: actions/checkout@v6
        with:
          repository: Alex206/convergent-test-repo
          ref: ab450c55503edd50f490539cca6bf0814aa8eac1
          path: benchmark-targets/s15-defect
          token: ${{ secrets.BENCHMARK_REPO_TOKEN }}
      - name: Checkout S15 clean
        uses: actions/checkout@v6
        with:
          repository: Alex206/convergent-test-repo
          ref: c6bc5fb9f477adcef03181cb1c6cdc1669a4a55b
          path: benchmark-targets/s15-clean
          token: ${{ secrets.BENCHMARK_REPO_TOKEN }}
      - name: Checkout S16 defective
        uses: actions/checkout@v6
        with:
          repository: Alex206/convergent-test-repo
          ref: caa2dd165fe960914caa5be0935483c05b65a77d
          path: benchmark-targets/s16-defect
          token: ${{ secrets.BENCHMARK_REPO_TOKEN }}
      - name: Checkout S16 clean
        uses: actions/checkout@v6
        with:
          repository: Alex206/convergent-test-repo
          ref: aa3e898b4144415f6e3ca10520943468ff09b9e0
          path: benchmark-targets/s16-clean
          token: ${{ secrets.BENCHMARK_REPO_TOKEN }}
      - name: Checkout S17 defective
        uses: actions/checkout@v6
        with:
          repository: Alex206/convergent-test-repo
          ref: ff93b87e8690c8c69a097200c977726c5daa3282
          path: benchmark-targets/s17-defect
          token: ${{ secrets.BENCHMARK_REPO_TOKEN }}
      - name: Checkout S17 clean
        uses: actions/checkout@v6
        with:
          repository: Alex206/convergent-test-repo
          ref: 021cc6ed786a7679b99b364ea9b8f8db2ec9afe3
          path: benchmark-targets/s17-clean
          token: ${{ secrets.BENCHMARK_REPO_TOKEN }}
      - name: Checkout S18 defective
        uses: actions/checkout@v6
        with:
          repository: Alex206/convergent-test-repo
          ref: 3650d739062c01a9672bee60bbda5d17e96d4621
          path: benchmark-targets/s18-defect
          token: ${{ secrets.BENCHMARK_REPO_TOKEN }}
      - name: Checkout S18 clean
        uses: actions/checkout@v6
        with:
          repository: Alex206/convergent-test-repo
          ref: ea7d8a95c64ef431e192840228c775946edca92d
          path: benchmark-targets/s18-clean
          token: ${{ secrets.BENCHMARK_REPO_TOKEN }}

      - name: Validate all frozen fixtures
        shell: bash
        run: |
          set -euo pipefail
          cases=(
            'v4-s15-lease-multidefect|benchmark-targets/s15-defect'
            'v4-s15-lease-clean|benchmark-targets/s15-clean'
            'v4-s16-authcache-multidefect|benchmark-targets/s16-defect'
            'v4-s16-authcache-clean|benchmark-targets/s16-clean'
            'v4-s17-headers-multidefect|benchmark-targets/s17-defect'
            'v4-s17-headers-clean|benchmark-targets/s17-clean'
            'v4-s18-retrytxn-multidefect|benchmark-targets/s18-defect'
            'v4-s18-retrytxn-clean|benchmark-targets/s18-clean'
          )
          mkdir -p "${RUN_ROOT}/validation"
          for entry in "${cases[@]}"; do
            IFS='|' read -r case_id target <<<"${entry}"
            echo "== Validate ${case_id} =="
            (cd "${target}" && python3 -B -m unittest discover -s tests -v)
            node src/headless/reviewer-v4-case-validation.js \
              "${case_id}" \
              "${GITHUB_WORKSPACE}/${target}" \
              "${RUN_ROOT}/validation/${case_id}.json"
          done

      - name: Run all R2 and R3 reviewer cells sequentially
        id: reviewer_cells
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "${RUN_ROOT}/runs"
          failures=0
          cases=(
            'v4-s15-lease-multidefect|benchmark-targets/s15-defect|benchmarks/15-lease-lifecycle.md'
            'v4-s15-lease-clean|benchmark-targets/s15-clean|benchmarks/15-lease-lifecycle.md'
            'v4-s16-authcache-multidefect|benchmark-targets/s16-defect|benchmarks/16-authorization-cache.md'
            'v4-s16-authcache-clean|benchmark-targets/s16-clean|benchmarks/16-authorization-cache.md'
            'v4-s17-headers-multidefect|benchmark-targets/s17-defect|benchmarks/17-header-normalization.md'
            'v4-s17-headers-clean|benchmark-targets/s17-clean|benchmarks/17-header-normalization.md'
            'v4-s18-retrytxn-multidefect|benchmark-targets/s18-defect|benchmarks/18-retry-transaction.md'
            'v4-s18-retrytxn-clean|benchmark-targets/s18-clean|benchmarks/18-retry-transaction.md'
          )
          for arm in luna-broad-3 luna-specialized-3; do
            for entry in "${cases[@]}"; do
              IFS='|' read -r case_id target prompt <<<"${entry}"
              out="${RUN_ROOT}/runs/${arm}/${case_id}"
              rm -rf "${out}"
              mkdir -p "${out}"
              fixture_sha="$(git -C "${target}" rev-parse HEAD)"
              RUN_OUTPUT="${out}" CASE_ID="${case_id}" ARM="${arm}" FIXTURE_SHA="${fixture_sha}" TARGET="${target}" node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          fs.writeFileSync(path.join(process.env.RUN_OUTPUT, 'benchmark-meta.json'), `${JSON.stringify({
            caseId: process.env.CASE_ID,
            fixtureRef: process.env.FIXTURE_SHA,
            fixtureSha: process.env.FIXTURE_SHA,
            arm: process.env.ARM,
            repeat: 1,
            target: process.env.TARGET,
          }, null, 2)}\n`);
          NODE
              echo "== ${arm} · ${case_id} · ${fixture_sha} =="
              export CONVERGENT_HEADLESS_ANSWERS_JSON='[]'
              node src/headless/reviewer-only-cli.js \
                --workspace "${GITHUB_WORKSPACE}/${target}" \
                --prompt-file "${GITHUB_WORKSPACE}/${target}/${prompt}" \
                --output-dir "${out}" \
                --arm "${arm}" \
                --flow auto \
                --audit-level full \
                --limit-policy continue \
                --max-model-calls 60 \
                --max-model-calls-per-turn 18 \
                --max-chat-requests 36 \
                --max-ai-credits 80
              rc=$?
              if [ "${rc}" -ne 0 ]; then
                echo "Cell failed: ${arm} ${case_id} (rc=${rc})" >&2
                failures=$((failures + 1))
              fi
              dirty="$(git -C "${target}" status --porcelain=v1 --untracked-files=all)"
              if [ -n "${dirty}" ]; then
                echo "Reviewer changed frozen workspace: ${arm} ${case_id}" >&2
                printf '%s\n' "${dirty}" >&2
                failures=$((failures + 1))
              fi
            done
          done
          printf '%s\n' "${failures}" > "${RUN_ROOT}/cell-failures.txt"
          echo "failures=${failures}" >> "${GITHUB_OUTPUT}"

      - name: Build V4 report
        if: always()
        shell: bash
        run: |
          node src/headless/reviewer-v4-report.js \
            "${RUN_ROOT}/runs" \
            "${RUN_ROOT}/reviewer-v4-report.json" \
            "${RUN_ROOT}/reviewer-v4-report.md"
          cat "${RUN_ROOT}/reviewer-v4-report.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload V4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewer-v4-sequential-${{ github.run_number }}
          path: ${{ runner.temp }}/reviewer-v4-sequential
          if-no-files-found: error
          retention-days: 30

      - name: Fail on incomplete reviewer cells
        if: always()
        shell: bash
        run: |
          failures="$(cat "${RUN_ROOT}/cell-failures.txt" 2>/dev/null || echo 999)"
          test "${failures}" = "0" || { echo "${failures} reviewer cell(s) failed." >&2; exit 1; }
