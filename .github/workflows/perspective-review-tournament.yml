name: Perspective Review Tournament

on:
  workflow_dispatch:
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/perspective-review-tournament.yml

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        arm: [luna-generic-panel-terra, luna-perspective-panel-terra]
        repeat: [1, 2, 3]
    env:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      COPILOT_PLUGIN_DIR_ONLY: 'true'
    steps:
      - name: Require benchmark credentials
        shell: bash
        env:
          BENCHMARK_REPO_TOKEN: ${{ secrets.BENCHMARK_REPO_TOKEN }}
        run: |
          test -n "${COPILOT_GITHUB_TOKEN}" || { echo "COPILOT_GITHUB_TOKEN is required." >&2; exit 2; }
          test -n "${BENCHMARK_REPO_TOKEN}" || { echo "BENCHMARK_REPO_TOKEN is required." >&2; exit 2; }

      - name: Checkout Convergent
        uses: actions/checkout@v6

      - name: Checkout benchmark fixture
        uses: actions/checkout@v6
        with:
          repository: Alex206/convergent-test-repo
          ref: benchmark/scenario08-path-containment
          path: benchmark-target
          token: ${{ secrets.BENCHMARK_REPO_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install Convergent dependencies
        run: npm ci

      - name: Prepare benchmark state and metadata
        shell: bash
        env:
          ARM: ${{ matrix.arm }}
          REPEAT: ${{ matrix.repeat }}
          RUN_OUTPUT: ${{ runner.temp }}/perspective-run
        run: |
          rm -rf "${RUN_OUTPUT}"
          mkdir -p "${RUN_OUTPUT}"
          fixture_sha="$(git -C benchmark-target rev-parse HEAD)"
          FIXTURE_SHA="${fixture_sha}" node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const meta = {
            topology: process.env.ARM,
            scenario: 'benchmarks/08-artifact-path-containment.md',
            repeat: Number(process.env.REPEAT),
            fixtureRef: 'benchmark/scenario08-path-containment',
            fixtureSha: process.env.FIXTURE_SHA,
            experiment: 'perspective-review-calibration-v1',
          };
          fs.writeFileSync(path.join(process.env.RUN_OUTPUT, 'benchmark-meta.json'), `${JSON.stringify(meta, null, 2)}\n`);
          NODE

      - name: Run equal-budget review panel
        id: panel
        continue-on-error: true
        timeout-minutes: 15
        shell: bash
        env:
          ARM: ${{ matrix.arm }}
          RUN_OUTPUT: ${{ runner.temp }}/perspective-run
        run: |
          export CONVERGENT_HEADLESS_ANSWERS_JSON='[]'
          set -o pipefail
          node src/headless/topology-cli.js \
            --workspace "${GITHUB_WORKSPACE}/benchmark-target" \
            --prompt-file "${GITHUB_WORKSPACE}/benchmark-target/benchmarks/08-artifact-path-containment.md" \
            --output-dir "${RUN_OUTPUT}" \
            --topology "${ARM}" \
            --flow fast \
            --audit-level full \
            --limit-policy continue \
            --max-reviewer-cycles 4 \
            --max-model-calls 100 \
            --max-model-calls-per-turn 16 \
            --max-chat-requests 36 \
            --max-ai-credits 60 \
            2>&1 | tee "${RUN_OUTPUT}/runner.log"

      - name: Independently validate target tests
        if: always()
        continue-on-error: true
        shell: bash
        env:
          RUN_OUTPUT: ${{ runner.temp }}/perspective-run
        run: |
          set +e
          (
            cd benchmark-target
            python3 -B -m unittest discover -s tests -v
          ) > "${RUN_OUTPUT}/target-validation.log" 2>&1
          rc=$?
          RC="${rc}" node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const rc = Number(process.env.RC);
          fs.writeFileSync(
            path.join(process.env.RUN_OUTPUT, 'target-validation.json'),
            `${JSON.stringify({ ok: rc === 0, exitCode: rc }, null, 2)}\n`,
          );
          NODE
          cat "${RUN_OUTPUT}/target-validation.log"
          exit 0

      - name: Run strengthened Scenario 08 oracle
        if: always()
        continue-on-error: true
        shell: bash
        env:
          RUN_OUTPUT: ${{ runner.temp }}/perspective-run
        run: |
          node src/headless/scenario08-acceptance.js \
            "${GITHUB_WORKSPACE}/benchmark-target" \
            "${RUN_OUTPUT}/scenario-acceptance.json"

      - name: Capture final workspace
        if: always()
        shell: bash
        env:
          RUN_OUTPUT: ${{ runner.temp }}/perspective-run
        run: |
          git -C benchmark-target status --porcelain=v1 --untracked-files=all > "${RUN_OUTPUT}/final-status.txt" || true
          git -C benchmark-target diff --binary --no-ext-diff > "${RUN_OUTPUT}/final-diff.patch" || true

      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perspective-${{ strategy.job-index }}-${{ matrix.arm }}-r${{ matrix.repeat }}
          path: ${{ runner.temp }}/perspective-run
          if-no-files-found: error
          retention-days: 14

  report:
    if: always()
    needs: benchmark
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Convergent
        uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Download all perspective evidence
        uses: actions/download-artifact@v5
        with:
          pattern: perspective-*
          path: ${{ runner.temp }}/perspective-results

      - name: Quarantine infrastructure-invalid runs
        shell: bash
        run: |
          node src/headless/topology-validity.js \
            "${{ runner.temp }}/perspective-results" \
            "${{ runner.temp }}/perspective-infrastructure-invalid-runs" \
            "${{ runner.temp }}/perspective-infrastructure-invalid.json" \
            "${{ runner.temp }}/perspective-infrastructure-invalid.md"
          cat "${{ runner.temp }}/perspective-infrastructure-invalid.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Build Pareto report
        shell: bash
        run: |
          node src/headless/topology-report.js \
            "${{ runner.temp }}/perspective-results" \
            "${{ runner.temp }}/perspective-report.json" \
            "${{ runner.temp }}/perspective-report.md"
          cat "${{ runner.temp }}/perspective-report.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Require complete equal-budget sample
        if: always()
        shell: bash
        run: |
          set +e
          node src/headless/topology-completeness.js \
            "${{ runner.temp }}/perspective-report.json" \
            "${{ runner.temp }}/perspective-completeness.json" \
            "${{ runner.temp }}/perspective-completeness.md" \
            luna-generic-panel-terra=3 \
            luna-perspective-panel-terra=3
          rc=$?
          cat "${{ runner.temp }}/perspective-completeness.md" >> "${GITHUB_STEP_SUMMARY}" 2>/dev/null || true
          exit "${rc}"

      - name: Upload tournament report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perspective-review-report-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/perspective-report.json
            ${{ runner.temp }}/perspective-report.md
            ${{ runner.temp }}/perspective-infrastructure-invalid.json
            ${{ runner.temp }}/perspective-infrastructure-invalid.md
            ${{ runner.temp }}/perspective-completeness.json
            ${{ runner.temp }}/perspective-completeness.md
          if-no-files-found: error
          retention-days: 30
