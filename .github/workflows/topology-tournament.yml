name: Convergent Topology Tournament

on:
  workflow_dispatch:
  pull_request:
    types: [ready_for_review]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - sample: 1
            arm: typed-reviewer-only
            repeat: 1
            worker_aid: 'false'
          - sample: 2
            arm: typed-worker-aid
            repeat: 1
            worker_aid: 'true'
          - sample: 3
            arm: typed-worker-aid
            repeat: 2
            worker_aid: 'true'
          - sample: 4
            arm: typed-reviewer-only
            repeat: 2
            worker_aid: 'false'
          - sample: 5
            arm: typed-reviewer-only
            repeat: 3
            worker_aid: 'false'
          - sample: 6
            arm: typed-worker-aid
            repeat: 3
            worker_aid: 'true'
    env:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      COPILOT_PLUGIN_DIR_ONLY: 'true'
      CONVERGENT_BENCHMARK_REVIEW_CONTRACT: acceptance-matrix-v1
      CONVERGENT_REVIEW_EVIDENCE_AUDITOR_MODEL: gpt-5.6-luna
      CONVERGENT_REVIEW_EVIDENCE_AUDITOR_TOPOLOGY: ${{ matrix.arm }}
      CONVERGENT_WORKER_TYPED_EVIDENCE_AID: ${{ matrix.worker_aid }}
    steps:
      - name: Require benchmark credentials
        shell: bash
        env:
          BENCHMARK_REPO_TOKEN: ${{ secrets.BENCHMARK_REPO_TOKEN }}
        run: |
          test -n "${COPILOT_GITHUB_TOKEN}" || { echo "COPILOT_GITHUB_TOKEN is required." >&2; exit 2; }
          test -n "${BENCHMARK_REPO_TOKEN}" || { echo "BENCHMARK_REPO_TOKEN is required." >&2; exit 2; }

      - name: Checkout Convergent
        uses: actions/checkout@v6

      - name: Checkout benchmark fixture
        uses: actions/checkout@v6
        with:
          repository: Alex206/convergent-test-repo
          ref: benchmark/scenario08-path-containment
          path: benchmark-target
          token: ${{ secrets.BENCHMARK_REPO_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install Convergent dependencies
        run: npm ci

      - name: Prepare benchmark state and metadata
        shell: bash
        env:
          ARM: ${{ matrix.arm }}
          REPEAT: ${{ matrix.repeat }}
          WORKER_AID: ${{ matrix.worker_aid }}
          RUN_OUTPUT: ${{ runner.temp }}/topology-run
        run: |
          rm -rf "${RUN_OUTPUT}"
          mkdir -p "${RUN_OUTPUT}"
          fixture_sha="$(git -C benchmark-target rev-parse HEAD)"
          FIXTURE_SHA="${fixture_sha}" node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const meta = {
            topology: process.env.ARM,
            scenario: 'benchmarks/08-artifact-path-containment.md',
            repeat: Number(process.env.REPEAT),
            fixtureRef: 'benchmark/scenario08-path-containment',
            fixtureSha: process.env.FIXTURE_SHA,
            workerTypedEvidenceAid: process.env.WORKER_AID === 'true',
          };
          fs.writeFileSync(path.join(process.env.RUN_OUTPUT, 'benchmark-meta.json'), `${JSON.stringify(meta, null, 2)}\n`);
          NODE

      - name: Run typed-evidence benchmark sample
        id: topology
        continue-on-error: true
        timeout-minutes: 15
        shell: bash
        env:
          RUN_OUTPUT: ${{ runner.temp }}/topology-run
        run: |
          export CONVERGENT_HEADLESS_ANSWERS_JSON='[]'
          set -o pipefail
          node src/headless/review-evidence-auditor-cli.js \
            --workspace "${GITHUB_WORKSPACE}/benchmark-target" \
            --prompt-file "${GITHUB_WORKSPACE}/benchmark-target/benchmarks/08-artifact-path-containment.md" \
            --output-dir "${RUN_OUTPUT}" \
            --topology luna-terra-structured \
            --flow fast \
            --audit-level full \
            --limit-policy continue \
            --max-reviewer-cycles 4 \
            --max-model-calls 80 \
            --max-model-calls-per-turn 16 \
            --max-chat-requests 28 \
            --max-ai-credits 60 \
            2>&1 | tee "${RUN_OUTPUT}/runner.log"

      - name: Independently validate target tests
        if: always()
        continue-on-error: true
        shell: bash
        env:
          RUN_OUTPUT: ${{ runner.temp }}/topology-run
        run: |
          set +e
          (
            cd benchmark-target
            python3 -B -m unittest discover -s tests -v
          ) > "${RUN_OUTPUT}/target-validation.log" 2>&1
          rc=$?
          RC="${rc}" node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const rc = Number(process.env.RC);
          fs.writeFileSync(
            path.join(process.env.RUN_OUTPUT, 'target-validation.json'),
            `${JSON.stringify({ ok: rc === 0, exitCode: rc }, null, 2)}\n`,
          );
          NODE
          cat "${RUN_OUTPUT}/target-validation.log"
          exit 0

      - name: Run strengthened Scenario 08 oracle
        if: always()
        continue-on-error: true
        shell: bash
        env:
          RUN_OUTPUT: ${{ runner.temp }}/topology-run
        run: |
          node src/headless/scenario08-acceptance.js \
            "${GITHUB_WORKSPACE}/benchmark-target" \
            "${RUN_OUTPUT}/scenario-acceptance.json"

      - name: Capture final workspace
        if: always()
        shell: bash
        env:
          RUN_OUTPUT: ${{ runner.temp }}/topology-run
        run: |
          git -C benchmark-target status --porcelain=v1 --untracked-files=all > "${RUN_OUTPUT}/final-status.txt" || true
          git -C benchmark-target diff --binary --no-ext-diff > "${RUN_OUTPUT}/final-diff.patch" || true

      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topology-${{ matrix.sample }}-${{ matrix.arm }}-r${{ matrix.repeat }}
          path: ${{ runner.temp }}/topology-run
          if-no-files-found: error
          retention-days: 14

  report:
    if: always()
    needs: benchmark
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Convergent
        uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Download all topology evidence
        uses: actions/download-artifact@v5
        with:
          pattern: topology-*
          path: ${{ runner.temp }}/topology-results

      - name: Quarantine infrastructure-invalid runs
        shell: bash
        run: |
          node src/headless/topology-validity.js \
            "${{ runner.temp }}/topology-results" \
            "${{ runner.temp }}/topology-infrastructure-invalid-runs" \
            "${{ runner.temp }}/topology-infrastructure-invalid.json" \
            "${{ runner.temp }}/topology-infrastructure-invalid.md"
          cat "${{ runner.temp }}/topology-infrastructure-invalid.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Build Pareto report
        shell: bash
        run: |
          node src/headless/topology-report.js \
            "${{ runner.temp }}/topology-results" \
            "${{ runner.temp }}/topology-report.json" \
            "${{ runner.temp }}/topology-report.md"
          cat "${{ runner.temp }}/topology-report.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Require complete reviewer-only vs Worker-aid sample
        if: always()
        shell: bash
        run: |
          REPORT="${{ runner.temp }}/topology-report.json" node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.env.REPORT, 'utf8'));
          const expected = new Map([
            ['typed-reviewer-only', new Set([1, 2, 3])],
            ['typed-worker-aid', new Set([1, 2, 3])],
          ]);
          const actual = new Map([...expected.keys()].map((name) => [name, new Set()]));
          const duplicates = [];
          for (const run of report.runs ?? []) {
            if (!actual.has(run.topology)) continue;
            const repeat = Number(run.repeat);
            if (actual.get(run.topology).has(repeat)) duplicates.push(`${run.topology}#${repeat}`);
            actual.get(run.topology).add(repeat);
          }
          let ok = duplicates.length === 0;
          console.log('## Typed-evidence Worker-aid comparison completeness');
          for (const [name, repeats] of actual) {
            const expectedRepeats = expected.get(name);
            const complete = [...expectedRepeats].every((repeat) => repeats.has(repeat));
            ok = ok && complete;
            console.log(`- ${name}: repeats ${[...repeats].sort().join(', ') || 'none'} / expected 1, 2, 3 ${complete ? '✓' : '✗'}`);
          }
          if (duplicates.length) console.log(`- duplicate scored repeats: ${duplicates.join(', ')}`);
          if (!ok) process.exit(2);
          NODE

      - name: Upload tournament report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topology-tournament-report-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/topology-report.json
            ${{ runner.temp }}/topology-report.md
            ${{ runner.temp }}/topology-infrastructure-invalid.json
            ${{ runner.temp }}/topology-infrastructure-invalid.md
          if-no-files-found: error
          retention-days: 30
