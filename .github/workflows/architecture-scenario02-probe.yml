name: Temporary Scenario 02 Efficiency Probe

on:
  pull_request:
    types:
      - synchronize

jobs:
  compare:
    if: github.event.pull_request.head.ref == 'agent/architecture-benchmark-matrix'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    permissions:
      contents: read
    env:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      COPILOT_PLUGIN_DIR_ONLY: 'true'
      BENCHMARK_REPO_TOKEN: ${{ secrets.BENCHMARK_REPO_TOKEN }}
      TARGET_SHA: 1f38b2606f306ef4902d6159e8c9b7f3d8fe9aef
      OUTPUT_ROOT: /tmp/scenario02-architecture
      CONVERGENT_HEADLESS_ANSWERS_JSON: '[]'
    steps:
      - name: Require benchmark credentials
        shell: bash
        run: |
          test -n "${COPILOT_GITHUB_TOKEN}" || exit 2
          test -n "${BENCHMARK_REPO_TOKEN}" || exit 2
      - name: Checkout Convergent
        uses: actions/checkout@v6
      - name: Checkout economical A1 target
        uses: actions/checkout@v6
        with:
          repository: Alex206/convergent-test-repo
          ref: ${{ env.TARGET_SHA }}
          path: target-economical
          token: ${{ secrets.BENCHMARK_REPO_TOKEN }}
      - name: Checkout adaptive A1 target
        uses: actions/checkout@v6
        with:
          repository: Alex206/convergent-test-repo
          ref: ${{ env.TARGET_SHA }}
          path: target-adaptive
          token: ${{ secrets.BENCHMARK_REPO_TOKEN }}
      - name: Checkout v0.2 target
        uses: actions/checkout@v6
        with:
          repository: Alex206/convergent-test-repo
          ref: ${{ env.TARGET_SHA }}
          path: target-v02
          token: ${{ secrets.BENCHMARK_REPO_TOKEN }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci

      - name: Run economical implementer plus strong reviewer
        id: economical
        continue-on-error: true
        timeout-minutes: 6
        shell: bash
        run: |
          mkdir -p "${OUTPUT_ROOT}/economical-a1"
          set +e
          node src/headless/architecture-cli.js \
            --workspace "${GITHUB_WORKSPACE}/target-economical" \
            --prompt-file "${GITHUB_WORKSPACE}/target-economical/benchmarks/02-medium-retry-backoff.md" \
            --output-dir "${OUTPUT_ROOT}/economical-a1" \
            --architecture implementer-reviewer \
            --recovery-policy strong-coordinator \
            --flow fast \
            --worker-a balanced-a \
            --reviewer strong \
            --experimental-risk medium \
            --audit-level full \
            --limit-policy pause \
            --max-model-calls 36 \
            --max-model-calls-per-turn 10 \
            --max-chat-requests 12 \
            --max-ai-credits 0 \
            2>&1 | tee "${OUTPUT_ROOT}/economical-a1/runner.log"
          code=${PIPESTATUS[0]}
          printf '{"runExit":%s}\n' "${code}" > "${OUTPUT_ROOT}/economical-a1/arm-status.json"
          exit "${code}"

      - name: Run adaptive implementer plus strong reviewer
        id: adaptive
        continue-on-error: true
        timeout-minutes: 6
        shell: bash
        run: |
          mkdir -p "${OUTPUT_ROOT}/adaptive-a1"
          set +e
          node src/headless/architecture-cli.js \
            --workspace "${GITHUB_WORKSPACE}/target-adaptive" \
            --prompt-file "${GITHUB_WORKSPACE}/target-adaptive/benchmarks/02-medium-retry-backoff.md" \
            --output-dir "${OUTPUT_ROOT}/adaptive-a1" \
            --architecture implementer-reviewer \
            --recovery-policy strong-coordinator \
            --flow fast \
            --worker-a adaptive \
            --reviewer strong \
            --experimental-risk medium \
            --audit-level full \
            --limit-policy pause \
            --max-model-calls 36 \
            --max-model-calls-per-turn 10 \
            --max-chat-requests 12 \
            --max-ai-credits 0 \
            2>&1 | tee "${OUTPUT_ROOT}/adaptive-a1/runner.log"
          code=${PIPESTATUS[0]}
          printf '{"runExit":%s}\n' "${code}" > "${OUTPUT_ROOT}/adaptive-a1/arm-status.json"
          exit "${code}"

      - name: Run released v0.2 reference
        id: v02
        continue-on-error: true
        timeout-minutes: 7
        shell: bash
        run: |
          mkdir -p "${OUTPUT_ROOT}/convergent-v02"
          set +e
          node src/headless/architecture-cli.js \
            --workspace "${GITHUB_WORKSPACE}/target-v02" \
            --prompt-file "${GITHUB_WORKSPACE}/target-v02/benchmarks/02-medium-retry-backoff.md" \
            --output-dir "${OUTPUT_ROOT}/convergent-v02" \
            --architecture convergent-v02 \
            --flow fast \
            --coordinator strong \
            --worker-a adaptive \
            --worker-b adaptive-diverse \
            --reviewer strong \
            --audit-level full \
            --limit-policy pause \
            --max-model-calls 36 \
            --max-model-calls-per-turn 10 \
            --max-chat-requests 12 \
            --max-ai-credits 0 \
            2>&1 | tee "${OUTPUT_ROOT}/convergent-v02/runner.log"
          code=${PIPESTATUS[0]}
          printf '{"runExit":%s}\n' "${code}" > "${OUTPUT_ROOT}/convergent-v02/arm-status.json"
          exit "${code}"

      - name: Run independent Scenario 02 oracle
        if: always()
        shell: bash
        run: |
          set +e
          for pair in "economical-a1 target-economical" "adaptive-a1 target-adaptive" "convergent-v02 target-v02"; do
            set -- ${pair}; arm="$1"; target="$2"; out="${OUTPUT_ROOT}/${arm}"
            TARGET="${GITHUB_WORKSPACE}/${target}" OUTPUT="${out}/scenario02-acceptance.json" python3 - <<'PY'
          import json, os, subprocess, sys
          root = os.environ['TARGET']
          probe = r'''
          import json, sys
          from dataclasses import FrozenInstanceError
          from taskflow import ConfigError, TaskSpec, build_attempts, parse_task, task_summary
          result = {"checks": []}
          def check(name, fn):
              try:
                  fn(); result["checks"].append({"name": name, "ok": True})
              except Exception as exc:
                  result["checks"].append({"name": name, "ok": False, "error": f"{type(exc).__name__}: {exc}"})
          def defaults():
              direct = TaskSpec(name="a", command=("echo", "a"))
              parsed = parse_task({"name": "b", "command": ["echo", "b"]})
              assert direct.retry_backoff_seconds == 0
              assert parsed.retry_backoff_seconds == 0
          def parsing():
              task = parse_task({"name":"a","command":["echo"],"retries":3,"retry_backoff_seconds":7})
              assert task.retry_backoff_seconds == 7
              for value in (-1, True, 1.5, "7", None):
                  try: parse_task({"name":"bad","command":["echo"],"retry_backoff_seconds":value})
                  except ConfigError: pass
                  else: raise AssertionError(f"expected ConfigError for retry_backoff_seconds={value!r}")
          def delays():
              task = TaskSpec(name="a", command=("echo",), retries=5, retry_backoff_seconds=2)
              attempts = build_attempts(task)
              assert [a.number for a in attempts] == [1,2,3,4,5,6]
              assert [a.delay_before_seconds for a in attempts] == [0,2,4,8,16,32]
              capped = build_attempts(TaskSpec(name="c", command=("echo",), retries=4, retry_backoff_seconds=200))
              assert [a.delay_before_seconds for a in capped] == [0,200,300,300,300]
              zero = build_attempts(TaskSpec(name="z", command=("echo",), retries=3, retry_backoff_seconds=0))
              assert [a.delay_before_seconds for a in zero] == [0,0,0,0]
          def reporting():
              summary = task_summary(TaskSpec(name="a", command=("echo",), retry_backoff_seconds=7))
              assert "backoff" in summary.lower(), summary
              assert "7" in summary, summary
          check("default/backwards-compatible retry backoff is zero", defaults)
          check("config parser accepts non-negative integer and rejects invalid values", parsing)
          check("attempt delays follow exponential retry formula with 300-second cap", delays)
          check("reporting includes configured backoff", reporting)
          result["ok"] = all(c["ok"] for c in result["checks"])
          print(json.dumps(result)); sys.exit(0 if result["ok"] else 1)
          '''
          completed = subprocess.run([sys.executable, '-B', '-c', probe], cwd=root, text=True, capture_output=True)
          try: behavior = json.loads(completed.stdout.strip() or '{}')
          except Exception: behavior = {"ok": False, "checks": [], "parseError": completed.stdout, "stderr": completed.stderr}
          tests = subprocess.run([sys.executable, '-B', '-m', 'unittest', 'discover', '-s', 'tests', '-v'], cwd=root, text=True, capture_output=True)
          report = {"ok": bool(behavior.get("ok")) and tests.returncode == 0, "behavior": behavior, "unitTestsExit": tests.returncode, "unitTestsTail": (tests.stdout + tests.stderr)[-5000:]}
          with open(os.environ['OUTPUT'], 'w', encoding='utf8') as f: json.dump(report, f, indent=2); f.write('\n')
          sys.exit(0 if report["ok"] else 1)
          PY
            events="$(find "${out}/audit" -name events.jsonl -type f 2>/dev/null | head -n 1)"
            if [[ -n "${events}" ]]; then node src/headless/efficiency-summary.js "${events}" "${out}/efficiency-summary.json" > "${out}/efficiency-summary.log" 2>&1 || true; fi
          done
          exit 0

      - name: Build compact comparison
        if: always()
        shell: bash
        run: |
          OUTPUT_ROOT="${OUTPUT_ROOT}" node - <<'NODE' | tee "${OUTPUT_ROOT}/summary.log"
          const fs = require('node:fs'); const path = require('node:path'); const root = process.env.OUTPUT_ROOT;
          const runs = ['economical-a1', 'adaptive-a1', 'convergent-v02'].map((arm) => {
            const result = JSON.parse(fs.readFileSync(path.join(root, arm, 'result.json'), 'utf8'));
            const acceptance = JSON.parse(fs.readFileSync(path.join(root, arm, 'scenario02-acceptance.json'), 'utf8'));
            const status = JSON.parse(fs.readFileSync(path.join(root, arm, 'arm-status.json'), 'utf8'));
            return { arm, architecture: result.architecture?.id, runStatus: result.status, runExit: status.runExit, oraclePass: acceptance.ok === true, usage: result.usage, actualRoleModels: result.actualRoleModels, stats: result.stats, error: result.error };
          });
          const summary = { targetSha: process.env.TARGET_SHA, runs }; fs.writeFileSync(path.join(root, 'summary.json'), JSON.stringify(summary, null, 2) + '\n'); console.log(JSON.stringify(summary, null, 2));
          NODE

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario02-efficiency-${{ github.run_number }}
          path: /tmp/scenario02-architecture
          if-no-files-found: error
          retention-days: 14

      - name: Report matrix status
        if: always()
        shell: bash
        run: |
          SUMMARY="${OUTPUT_ROOT}/summary.json" node - <<'NODE'
          const fs = require('node:fs'); const data = JSON.parse(fs.readFileSync(process.env.SUMMARY, 'utf8'));
          for (const r of data.runs ?? []) console.log(`${r.arm}: status=${r.runStatus} oracle=${r.oraclePass} calls=${r.usage?.calls} credits=${r.usage?.aiCredits} input=${r.usage?.inputTokens} elapsedMs=${r.usage?.elapsedMs}`);
          if ((data.runs ?? []).length !== 3) process.exit(1);
          NODE
