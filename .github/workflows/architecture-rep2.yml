name: Architecture Scenario 03 Rep 2

on:
  push:
    branches:
      - agent/architecture-benchmark-matrix
    paths:
      - .github/workflows/architecture-rep2.yml

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    env:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      COPILOT_PLUGIN_DIR_ONLY: 'true'
      CONVERGENT_HEADLESS_ANSWERS_JSON: '[]'
      TARGET_SHA: 1f38b2606f306ef4902d6159e8c9b7f3d8fe9aef
    steps:
      - name: Require benchmark credentials
        shell: bash
        env:
          BENCHMARK_REPO_TOKEN: ${{ secrets.BENCHMARK_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${COPILOT_GITHUB_TOKEN}"
          test -n "${BENCHMARK_REPO_TOKEN}"

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - run: npm ci

      - name: Prepare identical pinned benchmark workspaces
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BENCHMARK_REPO_TOKEN }}
        run: |
          set -euo pipefail
          for arm in single reviewer peers peers-reviewer current; do
            git clone --filter=blob:none --no-checkout "https://x-access-token:${GH_TOKEN}@github.com/Alex206/convergent-test-repo.git" "target-${arm}"
            git -C "target-${arm}" fetch --depth 1 origin "${TARGET_SHA}"
            git -C "target-${arm}" checkout --detach "${TARGET_SHA}"
            test "$(git -C "target-${arm}" rev-parse HEAD)" = "${TARGET_SHA}"
          done

      - name: Run five sequential architecture arms
        timeout-minutes: 27
        shell: bash
        run: |
          set +e
          root="${RUNNER_TEMP}/architecture-rep2"
          mkdir -p "${root}"

          run_arm() {
            name="$1"; target="$2"; architecture="$3"; worker_a="$4"; worker_b="$5"; reviewer="$6"
            out="${root}/${name}"
            mkdir -p "${out}"
            echo "=== ${name} ==="
            timeout --signal=TERM --kill-after=15s 300s \
              node src/headless/architecture-cli.js \
                --architecture "${architecture}" \
                --workspace "${GITHUB_WORKSPACE}/target-${target}" \
                --prompt-file "${GITHUB_WORKSPACE}/target-${target}/benchmarks/03-dependency-ordering.md" \
                --output-dir "${out}" \
                --flow fast \
                --coordinator strong \
                --worker-a "${worker_a}" \
                --worker-b "${worker_b}" \
                --reviewer "${reviewer}" \
                --audit-level full \
                --limit-policy pause \
                --max-model-calls 30 \
                --max-model-calls-per-turn 10 \
                --max-chat-requests 12 \
                --max-ai-credits 0 \
                2>&1 | tee "${out}/runner.log"
            run_rc=${PIPESTATUS[0]}

            node src/headless/scenario03-acceptance.js \
              "${GITHUB_WORKSPACE}/target-${target}" \
              "${out}/scenario03-acceptance.json"
            oracle_rc=$?

            events="$(find "${out}/audit" -name events.jsonl -type f 2>/dev/null | head -n 1)"
            if [[ -n "${events}" ]]; then
              node src/headless/efficiency-summary.js "${events}" "${out}/efficiency-summary.json" > "${out}/efficiency-summary.log"
            fi
            git -C "target-${target}" status --porcelain=v1 --untracked-files=all > "${out}/final-status.txt"
            git -C "target-${target}" diff --binary --no-ext-diff > "${out}/final-diff.patch"
            printf '{"runExit":%d,"oracleExit":%d}\n' "${run_rc}" "${oracle_rc}" > "${out}/arm-status.json"
          }

          run_arm single-terra single single-agent strong strong strong
          run_arm implementer-reviewer-terra reviewer implementer-reviewer strong strong strong
          run_arm peer-terra peers peer-competition strong strong strong
          run_arm peer-reviewer-terra peers-reviewer peer-competition-reviewer strong strong strong
          run_arm convergent-v02 current convergent-v02 adaptive adaptive-diverse strong

          node src/headless/architecture-summary.js \
            "${root}/comparison.json" "${root}/comparison.csv" \
            "${root}/single-terra" \
            "${root}/implementer-reviewer-terra" \
            "${root}/peer-terra" \
            "${root}/peer-reviewer-terra" \
            "${root}/convergent-v02" \
            > "${root}/comparison.log"

          exit 0

      - name: Upload repetition 2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario03-architecture-rep2
          path: ${{ runner.temp }}/architecture-rep2
          if-no-files-found: error
          retention-days: 14
