name: Temporary Scenario 07 Bug Localization Probe

on:
  pull_request:
    types:
      - synchronize

jobs:
  compare:
    if: github.event.pull_request.head.ref == 'agent/architecture-benchmark-matrix'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    env:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      COPILOT_PLUGIN_DIR_ONLY: 'true'
      BENCHMARK_REPO_TOKEN: ${{ secrets.BENCHMARK_REPO_TOKEN }}
      TARGET_SHA: 58f3f1d92793e78e862782466eaad4c56ba5a008
      OUTPUT_ROOT: /tmp/scenario07-architecture
      CONVERGENT_HEADLESS_ANSWERS_JSON: '[]'
    steps:
      - name: Require benchmark credentials
        shell: bash
        run: |
          test -n "${COPILOT_GITHUB_TOKEN}" || exit 2
          test -n "${BENCHMARK_REPO_TOKEN}" || exit 2
      - name: Checkout Convergent
        uses: actions/checkout@v6
      - name: Checkout economical bug fixture
        uses: actions/checkout@v6
        with:
          repository: Alex206/convergent-test-repo
          ref: ${{ env.TARGET_SHA }}
          path: target-economical
          token: ${{ secrets.BENCHMARK_REPO_TOKEN }}
      - name: Checkout v0.2 bug fixture
        uses: actions/checkout@v6
        with:
          repository: Alex206/convergent-test-repo
          ref: ${{ env.TARGET_SHA }}
          path: target-v02
          token: ${{ secrets.BENCHMARK_REPO_TOKEN }}
      - name: Verify seeded bug and green baseline tests
        shell: bash
        run: |
          for target in target-economical target-v02; do
            (cd "${target}" && python3 -B -m unittest discover -s tests -v) > "/tmp/${target}-baseline-tests.log" 2>&1
            TARGET="${target}" python3 - <<'PY'
          import os, sys
          sys.path.insert(0, os.environ['TARGET'])
          from taskflow import TaskSpec, select_tasks
          tasks = (
              TaskSpec(name='ci', command=('echo',), labels=('ci',)),
              TaskSpec(name='docs', command=('echo',), labels=('docs',)),
          )
          selected = select_tasks(tasks, required_labels=(label for label in ['ci']))
          names = tuple(task.name for task in selected)
          if names == ('ci',):
              raise SystemExit('seeded fixture no longer reproduces one-shot iterable bug')
          if names != ('ci', 'docs'):
              raise SystemExit(f'unexpected fixture behavior: {names!r}')
          print(f'seeded bug reproduced: generator required_labels selected {names!r}')
          PY
          done
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci

      - name: Run economical Luna implementer plus Terra reviewer
        id: economical
        continue-on-error: true
        timeout-minutes: 6
        shell: bash
        run: |
          mkdir -p "${OUTPUT_ROOT}/economical-a1"
          set +e
          node src/headless/architecture-cli.js \
            --workspace "${GITHUB_WORKSPACE}/target-economical" \
            --prompt-file "${GITHUB_WORKSPACE}/target-economical/benchmarks/07-one-shot-label-filter-bug.md" \
            --output-dir "${OUTPUT_ROOT}/economical-a1" \
            --architecture implementer-reviewer \
            --recovery-policy strong-coordinator \
            --flow fast \
            --worker-a balanced-a \
            --reviewer strong \
            --experimental-risk medium \
            --audit-level full \
            --limit-policy pause \
            --max-model-calls 34 \
            --max-model-calls-per-turn 10 \
            --max-chat-requests 12 \
            --max-ai-credits 0 \
            2>&1 | tee "${OUTPUT_ROOT}/economical-a1/runner.log"
          code=${PIPESTATUS[0]}
          printf '{"runExit":%s}\n' "${code}" > "${OUTPUT_ROOT}/economical-a1/arm-status.json"
          exit "${code}"

      - name: Run released v0.2 reference
        id: v02
        continue-on-error: true
        timeout-minutes: 7
        shell: bash
        run: |
          mkdir -p "${OUTPUT_ROOT}/convergent-v02"
          set +e
          node src/headless/architecture-cli.js \
            --workspace "${GITHUB_WORKSPACE}/target-v02" \
            --prompt-file "${GITHUB_WORKSPACE}/target-v02/benchmarks/07-one-shot-label-filter-bug.md" \
            --output-dir "${OUTPUT_ROOT}/convergent-v02" \
            --architecture convergent-v02 \
            --flow fast \
            --coordinator strong \
            --worker-a adaptive \
            --worker-b adaptive-diverse \
            --reviewer strong \
            --audit-level full \
            --limit-policy pause \
            --max-model-calls 34 \
            --max-model-calls-per-turn 10 \
            --max-chat-requests 12 \
            --max-ai-credits 0 \
            2>&1 | tee "${OUTPUT_ROOT}/convergent-v02/runner.log"
          code=${PIPESTATUS[0]}
          printf '{"runExit":%s}\n' "${code}" > "${OUTPUT_ROOT}/convergent-v02/arm-status.json"
          exit "${code}"

      - name: Run independent Scenario 07 oracle
        if: always()
        shell: bash
        run: |
          set +e
          for pair in "economical-a1 target-economical" "convergent-v02 target-v02"; do
            set -- ${pair}; arm="$1"; target="$2"; out="${OUTPUT_ROOT}/${arm}"
            TARGET="${GITHUB_WORKSPACE}/${target}" OUTPUT="${out}/scenario07-acceptance.json" python3 - <<'PY'
          import json, os, subprocess, sys
          root = os.environ['TARGET']
          probe = r'''
          import json, sys
          from taskflow import TaskSpec, select_tasks
          result = {"checks": []}
          def check(name, fn):
              try:
                  fn(); result["checks"].append({"name": name, "ok": True})
              except Exception as exc:
                  result["checks"].append({"name": name, "ok": False, "error": f"{type(exc).__name__}: {exc}"})
          tasks = (
              TaskSpec(name="a", command=("echo",), labels=("ci","linux")),
              TaskSpec(name="b", command=("echo",), labels=("ci","windows")),
              TaskSpec(name="docs", command=("echo",), labels=("docs",)),
              TaskSpec(name="disabled", command=("echo",), labels=("ci","linux"), enabled=False),
              TaskSpec(name="e", command=("echo",), labels=("ci","linux")),
          )
          def names(selected): return tuple(task.name for task in selected)
          def generator_equivalence():
              expected = ("a","b","e")
              assert names(select_tasks(tasks, required_labels=["ci"])) == expected
              assert names(select_tasks(tasks, required_labels=("ci",))) == expected
              assert names(select_tasks(tasks, required_labels=(label for label in ["ci"]))) == expected
          def multi_duplicate_and_order():
              assert names(select_tasks(tasks, required_labels=(label for label in ["ci","linux"]))) == ("a","e")
              assert names(select_tasks(tasks, required_labels=(label for label in ["ci","ci"]))) == ("a","b","e")
          def disabled_semantics():
              selected = select_tasks(tasks, required_labels=(label for label in ["ci","linux"]), include_disabled=True)
              assert names(selected) == ("a","disabled","e")
          def invalid_validation():
              invalid = ["ci", (label for label in [""]), (label for label in [None]), (label for label in ["ci", 3])]
              for labels in invalid:
                  try: select_tasks(tasks, required_labels=labels)
                  except ValueError: pass
                  else: raise AssertionError(f"expected ValueError for {labels!r}")
          def exactly_once_iterable():
              class OneShot:
                  def __init__(self, values): self.values = tuple(values); self.used = False
                  def __iter__(self):
                      if self.used: raise RuntimeError("required_labels iterated more than once")
                      self.used = True
                      return iter(self.values)
              labels = OneShot(["ci","linux"])
              assert names(select_tasks(tasks, required_labels=labels)) == ("a","e")
              assert labels.used is True
          def task_iterable_still_supported():
              selected = select_tasks((task for task in tasks), required_labels=(x for x in ["docs"]))
              assert names(selected) == ("docs",)
          check("generator/list/tuple required_labels are equivalent", generator_equivalence)
          check("multi-label and duplicate generator semantics preserve stable order", multi_duplicate_and_order)
          check("include_disabled semantics remain correct", disabled_semantics)
          check("invalid required-label validation remains enforced", invalid_validation)
          check("one-shot required_labels iterable is consumed exactly once", exactly_once_iterable)
          check("tasks itself may remain a one-shot iterable", task_iterable_still_supported)
          result["ok"] = all(c["ok"] for c in result["checks"])
          print(json.dumps(result)); sys.exit(0 if result["ok"] else 1)
          '''
          completed = subprocess.run([sys.executable, '-B', '-c', probe], cwd=root, text=True, capture_output=True)
          try: behavior = json.loads(completed.stdout.strip() or '{}')
          except Exception: behavior = {"ok": False, "checks": [], "parseError": completed.stdout, "stderr": completed.stderr}
          tests = subprocess.run([sys.executable, '-B', '-m', 'unittest', 'discover', '-s', 'tests', '-v'], cwd=root, text=True, capture_output=True)
          report = {"ok": bool(behavior.get("ok")) and tests.returncode == 0, "behavior": behavior, "unitTestsExit": tests.returncode, "unitTestsTail": (tests.stdout + tests.stderr)[-5000:]}
          with open(os.environ['OUTPUT'], 'w', encoding='utf8') as f: json.dump(report, f, indent=2); f.write('\n')
          sys.exit(0 if report["ok"] else 1)
          PY
            events="$(find "${out}/audit" -name events.jsonl -type f 2>/dev/null | head -n 1)"
            if [[ -n "${events}" ]]; then node src/headless/efficiency-summary.js "${events}" "${out}/efficiency-summary.json" > "${out}/efficiency-summary.log" 2>&1 || true; fi
          done
          exit 0

      - name: Build compact comparison
        if: always()
        shell: bash
        run: |
          OUTPUT_ROOT="${OUTPUT_ROOT}" node - <<'NODE' | tee "${OUTPUT_ROOT}/summary.log"
          const fs = require('node:fs'); const path = require('node:path'); const root = process.env.OUTPUT_ROOT;
          const runs = ['economical-a1', 'convergent-v02'].map((arm) => {
            const result = JSON.parse(fs.readFileSync(path.join(root, arm, 'result.json'), 'utf8'));
            const acceptance = JSON.parse(fs.readFileSync(path.join(root, arm, 'scenario07-acceptance.json'), 'utf8'));
            const status = JSON.parse(fs.readFileSync(path.join(root, arm, 'arm-status.json'), 'utf8'));
            return { arm, architecture: result.architecture?.id, runStatus: result.status, runExit: status.runExit, oraclePass: acceptance.ok === true, oracleChecksPassed: (acceptance.behavior?.checks ?? []).filter((x) => x.ok).length, oracleChecksTotal: (acceptance.behavior?.checks ?? []).length, usage: result.usage, actualRoleModels: result.actualRoleModels, stats: result.stats, error: result.error };
          });
          const summary = { targetSha: process.env.TARGET_SHA, scenario: 7, runs }; fs.writeFileSync(path.join(root, 'summary.json'), JSON.stringify(summary, null, 2) + '\n'); console.log(JSON.stringify(summary, null, 2));
          NODE

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario07-stage2-${{ github.run_number }}
          path: /tmp/scenario07-architecture
          if-no-files-found: error
          retention-days: 14

      - name: Report result
        if: always()
        shell: bash
        run: |
          SUMMARY="${OUTPUT_ROOT}/summary.json" node - <<'NODE'
          const fs = require('node:fs'); const data = JSON.parse(fs.readFileSync(process.env.SUMMARY, 'utf8'));
          for (const r of data.runs ?? []) console.log(`${r.arm}: status=${r.runStatus} oracle=${r.oraclePass} checks=${r.oracleChecksPassed}/${r.oracleChecksTotal} calls=${r.usage?.calls} credits=${r.usage?.aiCredits} input=${r.usage?.inputTokens} elapsedMs=${r.usage?.elapsedMs}`);
          if ((data.runs ?? []).length !== 2) process.exit(1);
          NODE
