name: Reviewer Latent Historical Panel Size V7

on:
  workflow_dispatch:
  push:
    branches:
      - agent/perspective-review-protocol-benchmark

jobs:
  benchmark:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[reviewer-v7-run]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      COPILOT_PLUGIN_DIR_ONLY: 'true'
    steps:
      - name: Require benchmark credentials
        shell: bash
        run: |
          test -n "${COPILOT_GITHUB_TOKEN}" || { echo "COPILOT_GITHUB_TOKEN is required." >&2; exit 2; }

      - name: Initialize run root
        shell: bash
        run: echo "RUN_ROOT=${RUNNER_TEMP}/reviewer-v7" >> "${GITHUB_ENV}"

      - name: Checkout benchmark harness
        uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate benchmark framework
        shell: bash
        run: |
          npm ci
          npm test
          npm run check

      - name: Checkout H15 latent report-integrity defect
        uses: actions/checkout@v6
        with:
          repository: Alex206/convergent
          ref: 9f0fc0b051f3e329625b05e137a7445fa7c4bfa4
          path: benchmark-targets/h15

      - name: Checkout H22 latent turn-budget defect
        uses: actions/checkout@v6
        with:
          repository: Alex206/convergent
          ref: 9ec6918680982b46e35a8820eb1e67a297fcff33
          path: benchmark-targets/h22

      - name: Checkout H23 latent CI-gate defect
        uses: actions/checkout@v6
        with:
          repository: Alex206/convergent
          ref: 6d63a9e9e08d0c4199b9e885e08e0ceb14fff6f5
          path: benchmark-targets/h23

      - name: Install historical target dependencies
        shell: bash
        run: |
          npm ci --prefix benchmark-targets/h15
          npm ci --prefix benchmark-targets/h22
          npm ci --prefix benchmark-targets/h23

      - name: Validate exact latent ground truth
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUN_ROOT}/validation"
          node src/headless/reviewer-v7-case-validation.js \
            v7-h15-latent-report-integrity \
            "${GITHUB_WORKSPACE}/benchmark-targets/h15" \
            "${RUN_ROOT}/validation/v7-h15-latent-report-integrity.json"
          node src/headless/reviewer-v7-case-validation.js \
            v7-h22-latent-turn-budget \
            "${GITHUB_WORKSPACE}/benchmark-targets/h22" \
            "${RUN_ROOT}/validation/v7-h22-latent-turn-budget.json"
          node src/headless/reviewer-v7-case-validation.js \
            v7-h23-latent-ci-gate \
            "${GITHUB_WORKSPACE}/benchmark-targets/h23" \
            "${RUN_ROOT}/validation/v7-h23-latent-ci-gate.json"

      - name: Run reviewer panel-size frontier sequentially
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "${RUN_ROOT}/runs"
          failures=0
          cases=(
            'v7-h15-latent-report-integrity|benchmark-targets/h15|benchmarks/reviewer-v7-h15-integrity.md'
            'v7-h22-latent-turn-budget|benchmark-targets/h22|benchmarks/reviewer-v7-h22-budget.md'
            'v7-h23-latent-ci-gate|benchmark-targets/h23|benchmarks/reviewer-v7-h23-ci.md'
          )
          arms=(terra-broad luna-broad-1 luna-broad-2 luna-broad-3)
          for arm in "${arms[@]}"; do
            for entry in "${cases[@]}"; do
              IFS='|' read -r case_id target prompt_file <<<"${entry}"
              out="${RUN_ROOT}/runs/${arm}/${case_id}"
              rm -rf "${out}"
              mkdir -p "${out}"
              fixture_sha="$(git -C "${target}" rev-parse HEAD)"
              RUN_OUTPUT="${out}" CASE_ID="${case_id}" ARM="${arm}" FIXTURE_SHA="${fixture_sha}" TARGET="${target}" node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          fs.writeFileSync(path.join(process.env.RUN_OUTPUT, 'benchmark-meta.json'), `${JSON.stringify({
            caseId: process.env.CASE_ID,
            fixtureRef: process.env.FIXTURE_SHA,
            fixtureSha: process.env.FIXTURE_SHA,
            arm: process.env.ARM,
            repeat: 1,
            target: process.env.TARGET,
          }, null, 2)}\n`);
          NODE
              prompt="$(cat "${GITHUB_WORKSPACE}/${prompt_file}")"
              echo "== ${arm} · ${case_id} · ${fixture_sha} =="
              export CONVERGENT_HEADLESS_ANSWERS_JSON='[]'
              if node src/headless/reviewer-only-cli.js \
                --workspace "${GITHUB_WORKSPACE}/${target}" \
                --prompt "${prompt}" \
                --output-dir "${out}" \
                --arm "${arm}" \
                --flow auto \
                --audit-level full \
                --limit-policy continue \
                --max-model-calls 60 \
                --max-model-calls-per-turn 18 \
                --max-chat-requests 36 \
                --max-ai-credits 80; then
                rc=0
              else
                rc=$?
              fi
              if [ "${rc}" -ne 0 ]; then
                echo "Cell failed: ${arm} ${case_id} (rc=${rc})" >&2
                failures=$((failures + 1))
              fi
              dirty="$(git -C "${target}" status --porcelain=v1 --untracked-files=all)"
              if [ -n "${dirty}" ]; then
                echo "Reviewer changed frozen workspace: ${arm} ${case_id}" >&2
                printf '%s\n' "${dirty}" >&2
                failures=$((failures + 1))
              fi
            done
          done
          printf '%s\n' "${failures}" > "${RUN_ROOT}/cell-failures.txt"

      - name: Build V7 report
        if: always()
        shell: bash
        run: |
          node src/headless/reviewer-v7-report.js \
            "${RUN_ROOT}/runs" \
            "${RUN_ROOT}/reviewer-v7-report.json" \
            "${RUN_ROOT}/reviewer-v7-report.md"
          cat "${RUN_ROOT}/reviewer-v7-report.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload V7 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewer-v7-${{ github.run_number }}
          path: ${{ runner.temp }}/reviewer-v7
          if-no-files-found: error
          retention-days: 30

      - name: Fail on incomplete reviewer cells
        if: always()
        shell: bash
        run: |
          failures="$(cat "${RUN_ROOT}/cell-failures.txt" 2>/dev/null || echo 999)"
          test "${failures}" = "0" || { echo "${failures} reviewer cell(s) failed." >&2; exit 1; }
