name: Release version bootstrap

on:
  push:
    branches:
      - agent/0.2-convergence-efficiency

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/0.2-convergence-efficiency
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Synchronize package metadata to 0.2.0
        shell: bash
        run: |
          set -euo pipefail
          current="$(node -p "require('./package.json').version")"
          if [[ "${current}" == "0.2.0" ]]; then
            echo 'Package metadata is already 0.2.0.'
            exit 0
          fi
          if [[ "${current}" != "0.2.0-dev.14" ]]; then
            echo "Unexpected package version: ${current}" >&2
            exit 2
          fi
          npm version 0.2.0 --no-git-tag-version
          test "$(node -p "require('./package.json').version")" = "0.2.0"
          test "$(node -p "require('./package-lock.json').version")" = "0.2.0"
          test "$(node -p "require('./package-lock.json').packages[''].version")" = "0.2.0"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m 'Prepare 0.2.0 package metadata'
          git push origin HEAD:agent/0.2-convergence-efficiency
