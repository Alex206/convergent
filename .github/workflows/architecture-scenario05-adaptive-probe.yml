name: Temporary Scenario 05 Adaptive Implementer Probe

on:
  pull_request:
    types:
      - synchronize

jobs:
  probe:
    if: github.event.pull_request.head.ref == 'agent/architecture-benchmark-matrix'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    env:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      COPILOT_PLUGIN_DIR_ONLY: 'true'
      BENCHMARK_REPO_TOKEN: ${{ secrets.BENCHMARK_REPO_TOKEN }}
      TARGET_SHA: 1f38b2606f306ef4902d6159e8c9b7f3d8fe9aef
      OUTPUT_ROOT: /tmp/scenario05-adaptive
      CONVERGENT_HEADLESS_ANSWERS_JSON: '[]'
    steps:
      - name: Require benchmark credentials
        shell: bash
        run: |
          test -n "${COPILOT_GITHUB_TOKEN}" || exit 2
          test -n "${BENCHMARK_REPO_TOKEN}" || exit 2
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: Alex206/convergent-test-repo
          ref: ${{ env.TARGET_SHA }}
          path: target
          token: ${{ secrets.BENCHMARK_REPO_TOKEN }}
      - name: Prepare Scenario 05 user state
        shell: bash
        run: |
          mkdir -p target/.vscode
          printf '%s\n' '{"files.trimTrailingWhitespace":true}' > target/.vscode/settings.json
          printf '%s\n' 'local benchmark note' > target/notes.local
          git -C target check-ignore -q notes.local
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - name: Run adaptive implementer plus strong reviewer
        timeout-minutes: 7
        shell: bash
        run: |
          mkdir -p "${OUTPUT_ROOT}"
          node src/headless/architecture-cli.js \
            --workspace "${GITHUB_WORKSPACE}/target" \
            --prompt-file "${GITHUB_WORKSPACE}/target/benchmarks/05-preexisting-workspace-state.md" \
            --output-dir "${OUTPUT_ROOT}" \
            --architecture implementer-reviewer \
            --recovery-policy strong-coordinator \
            --flow fast \
            --worker-a adaptive \
            --reviewer strong \
            --experimental-risk low \
            --audit-level full \
            --limit-policy pause \
            --max-model-calls 30 \
            --max-model-calls-per-turn 10 \
            --max-chat-requests 12 \
            --max-ai-credits 0 \
            2>&1 | tee "${OUTPUT_ROOT}/runner.log"
      - name: Validate
        shell: bash
        run: |
          node src/headless/scenario05-acceptance.js "${GITHUB_WORKSPACE}/target" "${OUTPUT_ROOT}/scenario05-acceptance.json"
          events="$(find "${OUTPUT_ROOT}/audit" -name events.jsonl -type f | head -n 1)"
          node src/headless/efficiency-summary.js "${events}" "${OUTPUT_ROOT}/efficiency-summary.json" > "${OUTPUT_ROOT}/efficiency-summary.log"
          (cd target && python3 -B -m unittest discover -s tests -v) > "${OUTPUT_ROOT}/target-validation.log" 2>&1
          RESULT="${OUTPUT_ROOT}/result.json" ACCEPTANCE="${OUTPUT_ROOT}/scenario05-acceptance.json" node - <<'NODE'
          const fs = require('node:fs');
          const r = JSON.parse(fs.readFileSync(process.env.RESULT, 'utf8'));
          const a = JSON.parse(fs.readFileSync(process.env.ACCEPTANCE, 'utf8'));
          console.log(`status=${r.status} oracle=${a.ok} calls=${r.usage.calls} credits=${r.usage.aiCredits} input=${r.usage.inputTokens} elapsedMs=${r.usage.elapsedMs}`);
          console.log(JSON.stringify(r.actualRoleModels, null, 2));
          if (r.status !== 'complete' || a.ok !== true) process.exit(1);
          NODE
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario05-adaptive-implementer-${{ github.run_number }}
          path: /tmp/scenario05-adaptive
          if-no-files-found: error
          retention-days: 14
