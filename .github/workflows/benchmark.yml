name: Convergent Benchmark

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Benchmark markdown path inside convergent-test-repo
        required: true
        default: benchmarks/03-dependency-ordering.md
        type: string
      flow:
        description: Convergent execution flow
        required: true
        default: fast
        type: choice
        options:
          - fast
          - auto
          - thorough
      target_ref:
        description: convergent-test-repo ref to benchmark from
        required: true
        default: main
        type: string
      limit_policy:
        description: Behavior at soft worker/reviewer limits
        required: true
        default: pause
        type: choice
        options:
          - pause
          - continue
      max_model_calls:
        description: Hard total model-call fuse for this benchmark run
        required: true
        default: '24'
        type: string
      max_model_calls_per_turn:
        description: Hard model-call fuse for one Convergent agent prompt/turn
        required: true
        default: '10'
        type: string
      max_chat_requests:
        description: Hard Copilot chat-request quota delta allowed during this benchmark
        required: true
        default: '8'
        type: string
      max_ai_credits:
        description: Soft reported AI-credit boundary checked at safe workflow boundaries
        required: true
        default: '12'
        type: string
      answers_json:
        description: JSON array of scripted answers for expected headless clarification/recovery prompts
        required: true
        default: '[]'
        type: string

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      COPILOT_PLUGIN_DIR_ONLY: 'true'
      CONVERGENT_HEADLESS_ANSWERS_JSON: ${{ inputs.answers_json }}
    steps:
      - name: Require benchmark credentials
        shell: bash
        env:
          BENCHMARK_REPO_TOKEN: ${{ secrets.BENCHMARK_REPO_TOKEN }}
        run: |
          if [[ -z "${COPILOT_GITHUB_TOKEN}" ]]; then
            echo "Repository secret COPILOT_GITHUB_TOKEN is required for a real headless Copilot SDK benchmark." >&2
            exit 2
          fi
          if [[ -z "${BENCHMARK_REPO_TOKEN}" ]]; then
            echo "Repository secret BENCHMARK_REPO_TOKEN is required with read-only Contents access to Alex206/convergent-test-repo." >&2
            exit 2
          fi

      - name: Checkout Convergent
        uses: actions/checkout@v6

      - name: Checkout benchmark target
        uses: actions/checkout@v6
        with:
          repository: Alex206/convergent-test-repo
          ref: ${{ inputs.target_ref }}
          path: benchmark-target
          token: ${{ secrets.BENCHMARK_REPO_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install Convergent dependencies
        run: npm ci

      - name: Record exact runtime versions
        shell: bash
        env:
          BENCHMARK_OUTPUT: ${{ runner.temp }}/convergent-benchmark
        run: |
          mkdir -p "${BENCHMARK_OUTPUT}"
          node - <<'NODE' > "${BENCHMARK_OUTPUT}/runtime-versions.json"
          const { runtimeVersionInfo } = require('./src/copilot/version-info');
          process.stdout.write(`${JSON.stringify(runtimeVersionInfo(), null, 2)}\n`);
          NODE

      - name: Run Convergent headless benchmark
        id: benchmark
        shell: bash
        env:
          BENCHMARK_OUTPUT: ${{ runner.temp }}/convergent-benchmark
        run: |
          set -o pipefail
          mkdir -p "${BENCHMARK_OUTPUT}"
          node src/headless/cli.js \
            --workspace "${GITHUB_WORKSPACE}/benchmark-target" \
            --prompt-file "${GITHUB_WORKSPACE}/benchmark-target/${{ inputs.scenario }}" \
            --output-dir "${BENCHMARK_OUTPUT}" \
            --flow "${{ inputs.flow }}" \
            --audit-level full \
            --limit-policy "${{ inputs.limit_policy }}" \
            --max-model-calls "${{ inputs.max_model_calls }}" \
            --max-model-calls-per-turn "${{ inputs.max_model_calls_per_turn }}" \
            --max-chat-requests "${{ inputs.max_chat_requests }}" \
            --max-ai-credits "${{ inputs.max_ai_credits }}" \
            2>&1 | tee "${BENCHMARK_OUTPUT}/runner.log"

      - name: Summarize benchmark efficiency
        if: always()
        continue-on-error: true
        shell: bash
        env:
          BENCHMARK_OUTPUT: ${{ runner.temp }}/convergent-benchmark
        run: |
          events="$(find "${BENCHMARK_OUTPUT}/audit" -name events.jsonl -type f 2>/dev/null | head -n 1)"
          if [[ -n "${events}" ]]; then
            node src/headless/efficiency-summary.js "${events}" "${BENCHMARK_OUTPUT}/efficiency-summary.json" > "${BENCHMARK_OUTPUT}/efficiency-summary.log"
          else
            echo "No trajectory events available; benchmark may have failed during preflight." > "${BENCHMARK_OUTPUT}/efficiency-summary.log"
          fi

      - name: Independently validate benchmark target
        if: always()
        continue-on-error: true
        shell: bash
        env:
          BENCHMARK_OUTPUT: ${{ runner.temp }}/convergent-benchmark
        run: |
          mkdir -p "${BENCHMARK_OUTPUT}"
          set -o pipefail
          (
            cd benchmark-target
            python3 -B -m unittest discover -s tests -v
          ) 2>&1 | tee "${BENCHMARK_OUTPUT}/target-validation.log"

      - name: Capture final target workspace
        if: always()
        shell: bash
        env:
          BENCHMARK_OUTPUT: ${{ runner.temp }}/convergent-benchmark
        run: |
          mkdir -p "${BENCHMARK_OUTPUT}"
          git -C benchmark-target status --porcelain=v1 --untracked-files=all > "${BENCHMARK_OUTPUT}/final-status.txt" || true
          git -C benchmark-target diff --binary --no-ext-diff > "${BENCHMARK_OUTPUT}/final-diff.patch" || true
          tar --exclude=.git -czf "${BENCHMARK_OUTPUT}/workspace.tar.gz" -C benchmark-target .

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: convergent-${{ inputs.flow }}-${{ github.run_number }}
          path: ${{ runner.temp }}/convergent-benchmark
          if-no-files-found: warn
          retention-days: 14
