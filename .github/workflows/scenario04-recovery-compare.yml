name: Scenario 04 Recovery Architecture Compare

on:
  push:
    branches:
      - agent/architecture-benchmark-matrix
    paths:
      - .github/workflows/scenario04-recovery-compare.yml

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    env:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      COPILOT_PLUGIN_DIR_ONLY: 'true'
      CONVERGENT_HEADLESS_ANSWERS_JSON: '["Use TASKFLOW_RELEASE_TOKEN=benchmark-only-secret only for the validation command; do not persist it or modify the validator."]'
      TARGET_SHA: 1f38b2606f306ef4902d6159e8c9b7f3d8fe9aef
    steps:
      - name: Require benchmark credentials
        shell: bash
        env:
          BENCHMARK_REPO_TOKEN: ${{ secrets.BENCHMARK_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${COPILOT_GITHUB_TOKEN}"
          test -n "${BENCHMARK_REPO_TOKEN}"

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - run: npm ci

      - name: Prepare identical pinned Scenario 04 workspaces
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BENCHMARK_REPO_TOKEN }}
        run: |
          set -euo pipefail
          for arm in reviewer current; do
            git clone --filter=blob:none --no-checkout "https://x-access-token:${GH_TOKEN}@github.com/Alex206/convergent-test-repo.git" "target-${arm}"
            git -C "target-${arm}" fetch --depth 1 origin "${TARGET_SHA}"
            git -C "target-${arm}" checkout --detach "${TARGET_SHA}"
            test "$(git -C "target-${arm}" rev-parse HEAD)" = "${TARGET_SHA}"
          done

      - name: Run recovery architectures sequentially
        timeout-minutes: 13
        shell: bash
        run: |
          set +e
          root="${RUNNER_TEMP}/scenario04-recovery"
          mkdir -p "${root}"

          run_arm() {
            name="$1"; target="$2"; architecture="$3"; recovery="$4"; worker_a="$5"; worker_b="$6"; reviewer="$7"
            out="${root}/${name}"
            mkdir -p "${out}"
            echo "=== ${name} ==="
            timeout --signal=TERM --kill-after=15s 360s \
              node src/headless/architecture-cli.js \
                --architecture "${architecture}" \
                --recovery-policy "${recovery}" \
                --workspace "${GITHUB_WORKSPACE}/target-${target}" \
                --prompt-file "${GITHUB_WORKSPACE}/target-${target}/benchmarks/04-blocked-external-validation.md" \
                --output-dir "${out}" \
                --flow fast \
                --coordinator strong \
                --worker-a "${worker_a}" \
                --worker-b "${worker_b}" \
                --reviewer "${reviewer}" \
                --audit-level full \
                --limit-policy pause \
                --max-model-calls 40 \
                --max-model-calls-per-turn 10 \
                --max-chat-requests 12 \
                --max-ai-credits 0 \
                2>&1 | tee "${out}/runner.log"
            run_rc=${PIPESTATUS[0]}

            events="$(find "${out}/audit" -name events.jsonl -type f 2>/dev/null | head -n 1)"
            oracle_rc=2
            if [[ -n "${events}" ]]; then
              node src/headless/scenario04-architecture-acceptance.js \
                "${GITHUB_WORKSPACE}/target-${target}" \
                "${events}" \
                "${out}/scenario04-architecture-acceptance.json"
              oracle_rc=$?
              node src/headless/efficiency-summary.js "${events}" "${out}/efficiency-summary.json" > "${out}/efficiency-summary.log"
            fi

            git -C "target-${target}" status --porcelain=v1 --untracked-files=all > "${out}/final-status.txt"
            git -C "target-${target}" diff --binary --no-ext-diff > "${out}/final-diff.patch"
            printf '{"runExit":%d,"oracleExit":%d}\n' "${run_rc}" "${oracle_rc}" > "${out}/arm-status.json"
          }

          run_arm implementer-reviewer-recovery reviewer implementer-reviewer strong-coordinator strong strong strong
          run_arm convergent-v02 current convergent-v02 strong-coordinator adaptive adaptive-diverse strong

          node src/headless/architecture-summary.js \
            "${root}/comparison.json" "${root}/comparison.csv" \
            "${root}/implementer-reviewer-recovery" \
            "${root}/convergent-v02" \
            > "${root}/comparison.log"

          exit 0

      - name: Upload recovery comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario04-recovery-architecture-compare
          path: ${{ runner.temp }}/scenario04-recovery
          if-no-files-found: error
          retention-days: 14
