name: Temporary Scenario 01 Efficiency Probe

on:
  pull_request:
    types:
      - synchronize

jobs:
  compare:
    if: github.event.pull_request.head.ref == 'agent/architecture-benchmark-matrix'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      COPILOT_PLUGIN_DIR_ONLY: 'true'
      BENCHMARK_REPO_TOKEN: ${{ secrets.BENCHMARK_REPO_TOKEN }}
      TARGET_SHA: 1f38b2606f306ef4902d6159e8c9b7f3d8fe9aef
      OUTPUT_ROOT: /tmp/scenario01-architecture
      CONVERGENT_HEADLESS_ANSWERS_JSON: '[]'
    steps:
      - name: Require benchmark credentials
        shell: bash
        run: |
          test -n "${COPILOT_GITHUB_TOKEN}" || exit 2
          test -n "${BENCHMARK_REPO_TOKEN}" || exit 2
      - name: Checkout Convergent
        uses: actions/checkout@v6
      - name: Checkout single-agent target
        uses: actions/checkout@v6
        with:
          repository: Alex206/convergent-test-repo
          ref: ${{ env.TARGET_SHA }}
          path: target-single
          token: ${{ secrets.BENCHMARK_REPO_TOKEN }}
      - name: Checkout implementer-reviewer target
        uses: actions/checkout@v6
        with:
          repository: Alex206/convergent-test-repo
          ref: ${{ env.TARGET_SHA }}
          path: target-reviewer
          token: ${{ secrets.BENCHMARK_REPO_TOKEN }}
      - name: Checkout v0.2 target
        uses: actions/checkout@v6
        with:
          repository: Alex206/convergent-test-repo
          ref: ${{ env.TARGET_SHA }}
          path: target-v02
          token: ${{ secrets.BENCHMARK_REPO_TOKEN }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci

      - name: Run adaptive single-agent
        id: single
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        run: |
          mkdir -p "${OUTPUT_ROOT}/single-agent"
          set +e
          node src/headless/architecture-cli.js \
            --workspace "${GITHUB_WORKSPACE}/target-single" \
            --prompt-file "${GITHUB_WORKSPACE}/target-single/benchmarks/01-small-duration-parser.md" \
            --output-dir "${OUTPUT_ROOT}/single-agent" \
            --architecture single-agent \
            --recovery-policy strong-coordinator \
            --flow fast \
            --worker-a adaptive \
            --experimental-risk low \
            --audit-level full \
            --limit-policy pause \
            --max-model-calls 30 \
            --max-model-calls-per-turn 10 \
            --max-chat-requests 12 \
            --max-ai-credits 0 \
            2>&1 | tee "${OUTPUT_ROOT}/single-agent/runner.log"
          code=${PIPESTATUS[0]}
          printf '{"runExit":%s}\n' "${code}" > "${OUTPUT_ROOT}/single-agent/arm-status.json"
          exit "${code}"

      - name: Run adaptive implementer plus strong reviewer
        id: reviewer
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        run: |
          mkdir -p "${OUTPUT_ROOT}/implementer-reviewer"
          set +e
          node src/headless/architecture-cli.js \
            --workspace "${GITHUB_WORKSPACE}/target-reviewer" \
            --prompt-file "${GITHUB_WORKSPACE}/target-reviewer/benchmarks/01-small-duration-parser.md" \
            --output-dir "${OUTPUT_ROOT}/implementer-reviewer" \
            --architecture implementer-reviewer \
            --recovery-policy strong-coordinator \
            --flow fast \
            --worker-a adaptive \
            --reviewer strong \
            --experimental-risk low \
            --audit-level full \
            --limit-policy pause \
            --max-model-calls 30 \
            --max-model-calls-per-turn 10 \
            --max-chat-requests 12 \
            --max-ai-credits 0 \
            2>&1 | tee "${OUTPUT_ROOT}/implementer-reviewer/runner.log"
          code=${PIPESTATUS[0]}
          printf '{"runExit":%s}\n' "${code}" > "${OUTPUT_ROOT}/implementer-reviewer/arm-status.json"
          exit "${code}"

      - name: Run released v0.2 reference
        id: v02
        continue-on-error: true
        timeout-minutes: 6
        shell: bash
        run: |
          mkdir -p "${OUTPUT_ROOT}/convergent-v02"
          set +e
          node src/headless/architecture-cli.js \
            --workspace "${GITHUB_WORKSPACE}/target-v02" \
            --prompt-file "${GITHUB_WORKSPACE}/target-v02/benchmarks/01-small-duration-parser.md" \
            --output-dir "${OUTPUT_ROOT}/convergent-v02" \
            --architecture convergent-v02 \
            --flow fast \
            --coordinator strong \
            --worker-a adaptive \
            --worker-b adaptive-diverse \
            --reviewer strong \
            --audit-level full \
            --limit-policy pause \
            --max-model-calls 30 \
            --max-model-calls-per-turn 10 \
            --max-chat-requests 12 \
            --max-ai-credits 0 \
            2>&1 | tee "${OUTPUT_ROOT}/convergent-v02/runner.log"
          code=${PIPESTATUS[0]}
          printf '{"runExit":%s}\n' "${code}" > "${OUTPUT_ROOT}/convergent-v02/arm-status.json"
          exit "${code}"

      - name: Run independent Scenario 01 oracle
        if: always()
        shell: bash
        run: |
          set +e
          for pair in "single-agent target-single" "implementer-reviewer target-reviewer" "convergent-v02 target-v02"; do
            set -- ${pair}
            arm="$1"; target="$2"; out="${OUTPUT_ROOT}/${arm}"
            TARGET="${GITHUB_WORKSPACE}/${target}" OUTPUT="${out}/scenario01-acceptance.json" python3 - <<'PY'
          import json, os, subprocess, sys
          root = os.environ['TARGET']
          probe = r'''
          import json, sys
          result = {"checks": []}
          def check(name, fn):
              try:
                  fn(); result["checks"].append({"name": name, "ok": True})
              except Exception as exc:
                  result["checks"].append({"name": name, "ok": False, "error": f"{type(exc).__name__}: {exc}"})
          def valid_cases():
              import taskflow
              from taskflow import parse_duration
              assert taskflow.parse_duration is parse_duration
              expected = {"30s": 30, "5m": 300, "2h": 7200, "  7s  ": 7, "\t3m\n": 180}
              for text, seconds in expected.items():
                  assert parse_duration(text) == seconds, (text, parse_duration(text), seconds)
          def invalid_cases():
              from taskflow import parse_duration
              for value in ["0s", "00m", "-1s", "1d", "1", "1.5s", "1 s", "s", "", " ", "+1s", "abc"]:
                  try: parse_duration(value)
                  except ValueError: pass
                  else: raise AssertionError(f"expected ValueError for {value!r}")
          check("public parse_duration export and valid conversions", valid_cases)
          check("zero, negative, malformed, and unsupported values raise ValueError", invalid_cases)
          result["ok"] = all(c["ok"] for c in result["checks"])
          print(json.dumps(result))
          sys.exit(0 if result["ok"] else 1)
          '''
          completed = subprocess.run([sys.executable, '-B', '-c', probe], cwd=root, text=True, capture_output=True)
          try: behavior = json.loads(completed.stdout.strip() or '{}')
          except Exception: behavior = {"ok": False, "checks": [], "parseError": completed.stdout}
          tests = subprocess.run([sys.executable, '-B', '-m', 'unittest', 'discover', '-s', 'tests', '-v'], cwd=root, text=True, capture_output=True)
          report = {"ok": bool(behavior.get("ok")) and tests.returncode == 0, "behavior": behavior, "unitTestsExit": tests.returncode, "unitTestsTail": (tests.stdout + tests.stderr)[-4000:]}
          with open(os.environ['OUTPUT'], 'w', encoding='utf8') as f: json.dump(report, f, indent=2); f.write('\n')
          sys.exit(0 if report["ok"] else 1)
          PY
            oracle=$?
            events="$(find "${out}/audit" -name events.jsonl -type f 2>/dev/null | head -n 1)"
            if [[ -n "${events}" ]]; then node src/headless/efficiency-summary.js "${events}" "${out}/efficiency-summary.json" > "${out}/efficiency-summary.log" 2>&1 || true; fi
            printf '%s\n' "${oracle}" > "${out}/oracle-exit.txt"
          done
          exit 0

      - name: Build compact comparison
        if: always()
        shell: bash
        run: |
          OUTPUT_ROOT="${OUTPUT_ROOT}" node - <<'NODE' | tee "${OUTPUT_ROOT}/summary.log"
          const fs = require('node:fs'); const path = require('node:path'); const root = process.env.OUTPUT_ROOT;
          const arms = ['single-agent', 'implementer-reviewer', 'convergent-v02'];
          const runs = arms.map((arm) => {
            const result = JSON.parse(fs.readFileSync(path.join(root, arm, 'result.json'), 'utf8'));
            const acceptance = JSON.parse(fs.readFileSync(path.join(root, arm, 'scenario01-acceptance.json'), 'utf8'));
            const status = JSON.parse(fs.readFileSync(path.join(root, arm, 'arm-status.json'), 'utf8'));
            return { arm, architecture: result.architecture?.id, runStatus: result.status, runExit: status.runExit, oraclePass: acceptance.ok === true, usage: result.usage, actualRoleModels: result.actualRoleModels, stats: result.stats };
          });
          const summary = { targetSha: process.env.TARGET_SHA, runs }; fs.writeFileSync(path.join(root, 'summary.json'), JSON.stringify(summary, null, 2) + '\n'); console.log(JSON.stringify(summary, null, 2));
          NODE

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario01-efficiency-${{ github.run_number }}
          path: /tmp/scenario01-architecture
          if-no-files-found: error
          retention-days: 14

      - name: Require all three oracles
        if: always()
        shell: bash
        run: |
          SUMMARY="${OUTPUT_ROOT}/summary.json" node - <<'NODE'
          const fs = require('node:fs'); const data = JSON.parse(fs.readFileSync(process.env.SUMMARY, 'utf8'));
          for (const r of data.runs ?? []) console.log(`${r.arm}: status=${r.runStatus} oracle=${r.oraclePass} calls=${r.usage?.calls} credits=${r.usage?.aiCredits} input=${r.usage?.inputTokens} elapsedMs=${r.usage?.elapsedMs}`);
          if ((data.runs ?? []).length !== 3 || data.runs.some((r) => r.runStatus !== 'complete' || r.oraclePass !== true)) process.exit(1);
          NODE
