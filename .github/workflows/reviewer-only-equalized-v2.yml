name: Equalized Reviewer-Only V2

on:
  workflow_dispatch:
    inputs:
      repeats_json:
        description: JSON array of repeat numbers
        required: true
        default: '[1]'
        type: string
  push:
    branches:
      - agent/perspective-review-protocol-benchmark

jobs:
  framework-validation:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[reviewer-v2-run]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm run check

  case-validation:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[reviewer-v2-run]')
    needs: framework-validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        case:
          - id: v2-s11-bool
            ref: benchmark/review-v2-s11-bool
            prompt: benchmarks/11-timeout-contract.md
          - id: v2-s12-backslash
            ref: benchmark/review-v2-s12-backslash
            prompt: benchmarks/12-archive-member.md
          - id: v2-s13-incomplete-frame
            ref: benchmark/review-v2-s13-incomplete-frame
            prompt: benchmarks/13-frame-buffer.md
          - id: v2-s13-clean
            ref: benchmark/review-v2-s13-clean
            prompt: benchmarks/13-frame-buffer.md
    steps:
      - name: Checkout Convergent
        uses: actions/checkout@v6
      - name: Checkout frozen review case
        uses: actions/checkout@v6
        with:
          repository: Alex206/convergent-test-repo
          ref: ${{ matrix.case.ref }}
          path: benchmark-target
          token: ${{ secrets.BENCHMARK_REPO_TOKEN }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - name: Visible fixture tests must pass
        shell: bash
        run: |
          cd benchmark-target
          python3 -B -m unittest discover -s tests -v
      - name: Validate hidden frozen-case ground truth
        shell: bash
        run: |
          node src/headless/reviewer-only-case-validation.js \
            '${{ matrix.case.id }}' \
            '${{ github.workspace }}/benchmark-target' \
            '${{ runner.temp }}/case-validation.json'
      - uses: actions/upload-artifact@v4
        with:
          name: reviewer-v2-case-validation-${{ matrix.case.id }}
          path: ${{ runner.temp }}/case-validation.json
          retention-days: 14

  benchmark:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[reviewer-v2-run]')
    needs: case-validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        arm:
          - terra-broad
          - luna-broad-3
          - luna-specialized-3
        case:
          - id: v2-s11-bool
            ref: benchmark/review-v2-s11-bool
            prompt: benchmarks/11-timeout-contract.md
          - id: v2-s12-backslash
            ref: benchmark/review-v2-s12-backslash
            prompt: benchmarks/12-archive-member.md
          - id: v2-s13-incomplete-frame
            ref: benchmark/review-v2-s13-incomplete-frame
            prompt: benchmarks/13-frame-buffer.md
          - id: v2-s13-clean
            ref: benchmark/review-v2-s13-clean
            prompt: benchmarks/13-frame-buffer.md
        repeat: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.repeats_json || '[1]') }}
    env:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      COPILOT_PLUGIN_DIR_ONLY: 'true'
    steps:
      - name: Require benchmark credentials
        shell: bash
        env:
          BENCHMARK_REPO_TOKEN: ${{ secrets.BENCHMARK_REPO_TOKEN }}
        run: |
          test -n "${COPILOT_GITHUB_TOKEN}" || { echo "COPILOT_GITHUB_TOKEN is required." >&2; exit 2; }
          test -n "${BENCHMARK_REPO_TOKEN}" || { echo "BENCHMARK_REPO_TOKEN is required." >&2; exit 2; }
      - name: Checkout Convergent
        uses: actions/checkout@v6
      - name: Checkout frozen review case
        uses: actions/checkout@v6
        with:
          repository: Alex206/convergent-test-repo
          ref: ${{ matrix.case.ref }}
          path: benchmark-target
          token: ${{ secrets.BENCHMARK_REPO_TOKEN }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - name: Prepare benchmark metadata
        shell: bash
        env:
          RUN_OUTPUT: ${{ runner.temp }}/reviewer-v2-run
          CASE_ID: ${{ matrix.case.id }}
          CASE_REF: ${{ matrix.case.ref }}
          ARM: ${{ matrix.arm }}
          REPEAT: ${{ matrix.repeat }}
        run: |
          rm -rf "${RUN_OUTPUT}"
          mkdir -p "${RUN_OUTPUT}"
          fixture_sha="$(git -C benchmark-target rev-parse HEAD)"
          FIXTURE_SHA="${fixture_sha}" node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          fs.writeFileSync(path.join(process.env.RUN_OUTPUT, 'benchmark-meta.json'), `${JSON.stringify({
            caseId: process.env.CASE_ID,
            fixtureRef: process.env.CASE_REF,
            fixtureSha: process.env.FIXTURE_SHA,
            arm: process.env.ARM,
            repeat: Number(process.env.REPEAT),
          }, null, 2)}\n`);
          NODE
      - name: Run frozen reviewer-only architecture
        shell: bash
        env:
          RUN_OUTPUT: ${{ runner.temp }}/reviewer-v2-run
        run: |
          export CONVERGENT_HEADLESS_ANSWERS_JSON='[]'
          node src/headless/reviewer-only-cli.js \
            --workspace "${GITHUB_WORKSPACE}/benchmark-target" \
            --prompt-file "${GITHUB_WORKSPACE}/benchmark-target/${{ matrix.case.prompt }}" \
            --output-dir "${RUN_OUTPUT}" \
            --arm "${{ matrix.arm }}" \
            --flow auto \
            --audit-level full \
            --limit-policy continue \
            --max-model-calls 60 \
            --max-model-calls-per-turn 18 \
            --max-chat-requests 36 \
            --max-ai-credits 80
      - name: Assert workspace stayed frozen
        shell: bash
        run: |
          test -z "$(git -C benchmark-target status --porcelain=v1 --untracked-files=all)" || {
            echo "Reviewer-only architecture changed the frozen workspace." >&2
            git -C benchmark-target status --porcelain=v1 --untracked-files=all >&2
            exit 1
          }
      - name: Upload reviewer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewer-v2-${{ matrix.arm }}-${{ matrix.case.id }}-r${{ matrix.repeat }}
          path: ${{ runner.temp }}/reviewer-v2-run
          if-no-files-found: error
          retention-days: 14

  report:
    if: always() && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[reviewer-v2-run]'))
    needs: benchmark
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Download reviewer evidence
        uses: actions/download-artifact@v5
        with:
          pattern: reviewer-v2-*
          path: ${{ runner.temp }}/reviewer-v2-results
      - name: Build reviewer-only comparison report
        shell: bash
        run: |
          node src/headless/reviewer-only-report.js \
            "${{ runner.temp }}/reviewer-v2-results" \
            "${{ runner.temp }}/reviewer-v2-report.json" \
            "${{ runner.temp }}/reviewer-v2-report.md"
          cat "${{ runner.temp }}/reviewer-v2-report.md" >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@v4
        with:
          name: reviewer-v2-equalized-report-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/reviewer-v2-report.json
            ${{ runner.temp }}/reviewer-v2-report.md
          retention-days: 30
