name: CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install
      - run: npm test
      - run: npm run check
      - name: Package VSIX
        run: npm run package -- --out /tmp/convergent-ci.vsix

      - name: Detect models-only preflight request
        id: model-preflight
        if: >-
          github.event_name == 'pull_request' &&
          contains(github.event.pull_request.labels.*.name, 'headless-model-preflight')
        shell: bash
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          if [[ -z "${COPILOT_GITHUB_TOKEN}" ]]; then
            echo "::notice::Models-only preflight requested but repository secret COPILOT_GITHUB_TOKEN is not configured."
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
            echo "Models-only preflight requested. This calls listModels() only and sends no agent prompt."
          fi

      - name: Run models-only Copilot preflight
        if: steps.model-preflight.outputs.enabled == 'true'
        shell: bash
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          COPILOT_PLUGIN_DIR_ONLY: 'true'
          MODEL_PREFLIGHT_OUTPUT: ${{ runner.temp }}/convergent-model-preflight/models.json
        run: |
          mkdir -p "$(dirname "${MODEL_PREFLIGHT_OUTPUT}")"
          node src/headless/model-preflight.js "${MODEL_PREFLIGHT_OUTPUT}"

      - name: Upload models-only preflight
        if: always() && steps.model-preflight.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: convergent-model-preflight-${{ github.run_number }}
          path: ${{ runner.temp }}/convergent-model-preflight
          if-no-files-found: error
          retention-days: 14

      - name: Detect headless benchmark request
        id: headless-benchmark
        if: >-
          (github.event_name == 'push' && contains(github.event.head_commit.message, '[benchmark]')) ||
          (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'headless-benchmark'))
        shell: bash
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          BENCHMARK_REPO_TOKEN: ${{ secrets.BENCHMARK_REPO_TOKEN }}
        run: |
          missing=0
          if [[ -z "${COPILOT_GITHUB_TOKEN}" ]]; then
            echo "::notice::Headless benchmark requested but repository secret COPILOT_GITHUB_TOKEN is not configured."
            missing=1
          fi
          if [[ -z "${BENCHMARK_REPO_TOKEN}" ]]; then
            echo "::notice::Headless benchmark requested but repository secret BENCHMARK_REPO_TOKEN is not configured. It needs read-only Contents access to Alex206/convergent-test-repo."
            missing=1
          fi
          if [[ "${missing}" == "0" ]]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
            echo "Headless benchmark requested and both required credentials are available."
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "Normal CI remains valid; benchmark execution is skipped until both credentials are configured."
          fi

      - name: Checkout benchmark target
        if: steps.headless-benchmark.outputs.enabled == 'true'
        uses: actions/checkout@v6
        with:
          repository: Alex206/convergent-test-repo
          ref: main
          path: benchmark-target
          token: ${{ secrets.BENCHMARK_REPO_TOKEN }}

      - name: Run headless Scenario 03
        id: scenario03
        if: steps.headless-benchmark.outputs.enabled == 'true'
        shell: bash
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          COPILOT_PLUGIN_DIR_ONLY: 'true'
          CONVERGENT_HEADLESS_ANSWERS_JSON: '[]'
          BENCHMARK_OUTPUT: ${{ runner.temp }}/convergent-benchmark
        run: |
          set -o pipefail
          mkdir -p "${BENCHMARK_OUTPUT}"
          node src/headless/cli.js \
            --workspace "${GITHUB_WORKSPACE}/benchmark-target" \
            --prompt-file "${GITHUB_WORKSPACE}/benchmark-target/benchmarks/03-dependency-ordering.md" \
            --output-dir "${BENCHMARK_OUTPUT}" \
            --flow fast \
            --audit-level full \
            --limit-policy pause \
            --max-model-calls 24 \
            --max-model-calls-per-turn 10 \
            --max-chat-requests 8 \
            --max-ai-credits 12 \
            2>&1 | tee "${BENCHMARK_OUTPUT}/runner.log"

      - name: Independently validate benchmark target
        if: always() && steps.headless-benchmark.outputs.enabled == 'true'
        continue-on-error: true
        shell: bash
        env:
          BENCHMARK_OUTPUT: ${{ runner.temp }}/convergent-benchmark
        run: |
          mkdir -p "${BENCHMARK_OUTPUT}"
          set -o pipefail
          (
            cd benchmark-target
            python3 -B -m unittest discover -s tests -v
          ) 2>&1 | tee "${BENCHMARK_OUTPUT}/target-validation.log"

      - name: Capture final target workspace
        if: always() && steps.headless-benchmark.outputs.enabled == 'true'
        shell: bash
        env:
          BENCHMARK_OUTPUT: ${{ runner.temp }}/convergent-benchmark
        run: |
          mkdir -p "${BENCHMARK_OUTPUT}"
          git -C benchmark-target status --porcelain=v1 --untracked-files=all > "${BENCHMARK_OUTPUT}/final-status.txt" || true
          git -C benchmark-target diff --binary --no-ext-diff > "${BENCHMARK_OUTPUT}/final-diff.patch" || true
          tar --exclude=.git -czf "${BENCHMARK_OUTPUT}/workspace.tar.gz" -C benchmark-target .

      - name: Upload headless benchmark evidence
        if: always() && steps.headless-benchmark.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: convergent-fast-scenario03-${{ github.run_number }}
          path: ${{ runner.temp }}/convergent-benchmark
          if-no-files-found: warn
          retention-days: 14
