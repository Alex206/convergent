name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Verify Linux Copilot runtime dependency
        shell: bash
        run: |
          test -d node_modules/@github/copilot-linux-x64
          test ! -d node_modules/@github/copilot-win32-x64
      - name: Package Linux x64 VSIX
        run: npm run package -- --out /tmp/convergent-linux-x64.vsix
      - name: Verify Linux x64 VSIX payload
        shell: bash
        run: |
          unzip -p /tmp/convergent-linux-x64.vsix extension.vsixmanifest > /tmp/extension.vsixmanifest
          grep -q 'TargetPlatform="linux-x64"' /tmp/extension.vsixmanifest
          unzip -l /tmp/convergent-linux-x64.vsix | grep -q 'extension/node_modules/@github/copilot-linux-x64/'
          if unzip -l /tmp/convergent-linux-x64.vsix | grep -q 'extension/node_modules/@github/copilot-win32-x64/'; then
            echo 'Windows Copilot runtime unexpectedly packaged in Linux VSIX.' >&2
            exit 1
          fi

      - name: Detect models-only preflight request
        id: model-preflight
        if: >-
          github.event_name == 'pull_request' &&
          contains(github.event.pull_request.labels.*.name, 'headless-model-preflight')
        shell: bash
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          if [[ -z "${COPILOT_GITHUB_TOKEN}" ]]; then
            echo "::notice::Models-only preflight requested but repository secret COPILOT_GITHUB_TOKEN is not configured."
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
            echo "Models-only preflight requested. This calls listModels() only and sends no agent prompt."
          fi

      - name: Run models-only Copilot preflight
        if: steps.model-preflight.outputs.enabled == 'true'
        timeout-minutes: 2
        shell: bash
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          COPILOT_PLUGIN_DIR_ONLY: 'true'
          MODEL_PREFLIGHT_OUTPUT: ${{ runner.temp }}/convergent-model-preflight/models.json
        run: |
          mkdir -p "$(dirname "${MODEL_PREFLIGHT_OUTPUT}")"
          node src/headless/model-preflight.js "${MODEL_PREFLIGHT_OUTPUT}"

      - name: Upload models-only preflight
        if: always() && steps.model-preflight.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: convergent-model-preflight-${{ github.run_number }}
          path: ${{ runner.temp }}/convergent-model-preflight
          if-no-files-found: error
          retention-days: 14

      - name: Detect headless benchmark request
        id: headless-benchmark
        if: >-
          github.event_name == 'pull_request' &&
          contains(github.event.pull_request.labels.*.name, 'headless-benchmark')
        shell: bash
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          BENCHMARK_REPO_TOKEN: ${{ secrets.BENCHMARK_REPO_TOKEN }}
        run: |
          missing=0
          if [[ -z "${COPILOT_GITHUB_TOKEN}" ]]; then
            echo "::notice::Headless benchmark requested but repository secret COPILOT_GITHUB_TOKEN is not configured."
            missing=1
          fi
          if [[ -z "${BENCHMARK_REPO_TOKEN}" ]]; then
            echo "::notice::Headless benchmark requested but repository secret BENCHMARK_REPO_TOKEN is not configured. It needs read-only Contents access to Alex206/convergent-test-repo."
            missing=1
          fi
          if [[ "${missing}" == "0" ]]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
            echo "Headless benchmark requested and both required credentials are available."
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "Normal CI remains valid; benchmark execution is skipped until both credentials are configured."
          fi

      - name: Checkout benchmark target
        if: steps.headless-benchmark.outputs.enabled == 'true'
        uses: actions/checkout@v6
        with:
          repository: Alex206/convergent-test-repo
          ref: main
          path: benchmark-target
          token: ${{ secrets.BENCHMARK_REPO_TOKEN }}

      - name: Run headless Scenario 03
        id: scenario03
        if: steps.headless-benchmark.outputs.enabled == 'true'
        timeout-minutes: 9
        shell: bash
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          COPILOT_PLUGIN_DIR_ONLY: 'true'
          CONVERGENT_HEADLESS_ANSWERS_JSON: '[]'
          BENCHMARK_OUTPUT: ${{ runner.temp }}/convergent-benchmark
        run: |
          set -o pipefail
          mkdir -p "${BENCHMARK_OUTPUT}"
          node - <<'NODE' > "${BENCHMARK_OUTPUT}/runtime-versions.json"
          const { runtimeVersionInfo } = require('./src/copilot/version-info');
          process.stdout.write(`${JSON.stringify(runtimeVersionInfo(), null, 2)}\n`);
          NODE
          node src/headless/cli.js \
            --workspace "${GITHUB_WORKSPACE}/benchmark-target" \
            --prompt-file "${GITHUB_WORKSPACE}/benchmark-target/benchmarks/03-dependency-ordering.md" \
            --output-dir "${BENCHMARK_OUTPUT}" \
            --flow fast \
            --audit-level full \
            --limit-policy pause \
            --max-model-calls 24 \
            --max-model-calls-per-turn 10 \
            --max-chat-requests 8 \
            --max-ai-credits 12 \
            2>&1 | tee "${BENCHMARK_OUTPUT}/runner.log"

      - name: Summarize benchmark efficiency
        if: always() && steps.headless-benchmark.outputs.enabled == 'true'
        continue-on-error: true
        shell: bash
        env:
          BENCHMARK_OUTPUT: ${{ runner.temp }}/convergent-benchmark
        run: |
          events="$(find "${BENCHMARK_OUTPUT}/audit" -name events.jsonl -type f 2>/dev/null | head -n 1)"
          if [[ -n "${events}" ]]; then
            node src/headless/efficiency-summary.js "${events}" "${BENCHMARK_OUTPUT}/efficiency-summary.json" > "${BENCHMARK_OUTPUT}/efficiency-summary.log"
          else
            echo "No trajectory events available; benchmark may have failed during preflight." > "${BENCHMARK_OUTPUT}/efficiency-summary.log"
          fi

      - name: Independently validate benchmark target
        if: always() && steps.headless-benchmark.outputs.enabled == 'true'
        continue-on-error: true
        shell: bash
        env:
          BENCHMARK_OUTPUT: ${{ runner.temp }}/convergent-benchmark
        run: |
          mkdir -p "${BENCHMARK_OUTPUT}"
          set -o pipefail
          (
            cd benchmark-target
            python3 -B -m unittest discover -s tests -v
          ) 2>&1 | tee "${BENCHMARK_OUTPUT}/target-validation.log"

      - name: Capture final target workspace
        if: always() && steps.headless-benchmark.outputs.enabled == 'true'
        shell: bash
        env:
          BENCHMARK_OUTPUT: ${{ runner.temp }}/convergent-benchmark
        run: |
          mkdir -p "${BENCHMARK_OUTPUT}"
          git -C benchmark-target status --porcelain=v1 --untracked-files=all > "${BENCHMARK_OUTPUT}/final-status.txt" || true
          git -C benchmark-target diff --binary --no-ext-diff > "${BENCHMARK_OUTPUT}/final-diff.patch" || true
          tar --exclude=.git -czf "${BENCHMARK_OUTPUT}/workspace.tar.gz" -C benchmark-target .

      - name: Upload headless benchmark evidence
        if: always() && steps.headless-benchmark.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: convergent-fast-scenario03-${{ github.run_number }}
          path: ${{ runner.temp }}/convergent-benchmark
          if-no-files-found: warn
          retention-days: 14

      - name: Detect bounded auto smoke request
        id: auto-smoke
        if: >-
          github.event_name == 'pull_request' &&
          contains(github.event.pull_request.labels.*.name, 'headless-auto-smoke')
        shell: bash
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          BENCHMARK_REPO_TOKEN: ${{ secrets.BENCHMARK_REPO_TOKEN }}
        run: |
          missing=0
          if [[ -z "${COPILOT_GITHUB_TOKEN}" ]]; then
            echo "::notice::Auto smoke requested but COPILOT_GITHUB_TOKEN is not configured."
            missing=1
          fi
          if [[ -z "${BENCHMARK_REPO_TOKEN}" ]]; then
            echo "::notice::Auto smoke requested but BENCHMARK_REPO_TOKEN is not configured."
            missing=1
          fi
          if [[ "${missing}" == "0" ]]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Checkout auto-smoke target
        if: steps.auto-smoke.outputs.enabled == 'true'
        uses: actions/checkout@v6
        with:
          repository: Alex206/convergent-test-repo
          ref: main
          path: auto-smoke-target
          token: ${{ secrets.BENCHMARK_REPO_TOKEN }}

      - name: Run bounded plan-only auto diagnostic
        id: auto-smoke-run
        if: steps.auto-smoke.outputs.enabled == 'true'
        continue-on-error: true
        timeout-minutes: 4
        shell: bash
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          COPILOT_PLUGIN_DIR_ONLY: 'true'
          CONVERGENT_HEADLESS_ANSWERS_JSON: '[]'
          CONVERGENT_HEADLESS_STOP_AFTER_PLAN: '1'
          SMOKE_OUTPUT: ${{ runner.temp }}/convergent-auto-smoke
        run: |
          set -o pipefail
          mkdir -p "${SMOKE_OUTPUT}"
          echo "NON-AUTHORITATIVE PLAN-ONLY DIAGNOSTIC: every role intentionally uses Copilot auto; stop immediately after a valid plan." | tee "${SMOKE_OUTPUT}/diagnostic-scope.txt"
          node - <<'NODE' > "${SMOKE_OUTPUT}/runtime-versions.json"
          const { runtimeVersionInfo } = require('./src/copilot/version-info');
          process.stdout.write(`${JSON.stringify(runtimeVersionInfo(), null, 2)}\n`);
          NODE
          node src/headless/cli.js \
            --workspace "${GITHUB_WORKSPACE}/auto-smoke-target" \
            --prompt-file "${GITHUB_WORKSPACE}/auto-smoke-target/benchmarks/03-dependency-ordering.md" \
            --output-dir "${SMOKE_OUTPUT}" \
            --flow fast \
            --coordinator auto \
            --worker-a auto \
            --worker-b auto \
            --reviewer auto \
            --audit-level full \
            --limit-policy pause \
            --max-model-calls 10 \
            --max-model-calls-per-turn 9 \
            --max-chat-requests 3 \
            --max-ai-credits 4 \
            2>&1 | tee "${SMOKE_OUTPUT}/runner.log"

      - name: Validate plan-only diagnostic stop
        if: always() && steps.auto-smoke.outputs.enabled == 'true'
        shell: bash
        env:
          SMOKE_OUTPUT: ${{ runner.temp }}/convergent-auto-smoke
        run: |
          set -euo pipefail
          events="$(find "${SMOKE_OUTPUT}/audit" -name events.jsonl -type f 2>/dev/null | head -n 1)"
          if [[ -z "${events}" ]]; then
            echo "Plan-only diagnostic produced no trajectory events." >&2
            exit 2
          fi
          EVENTS_FILE="${events}" node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const events = fs.readFileSync(process.env.EVENTS_FILE, 'utf8')
            .split(/\r?\n/)
            .filter(Boolean)
            .map((line) => JSON.parse(line));
          const accepted = events.find((event) => event.type === 'plan_accepted');
          const complete = events.find((event) => event.type === 'headless_plan_diagnostic_complete');
          const taskStarts = events.filter((event) => event.type === 'task_start');
          if (!accepted || !complete) {
            console.error('Expected a valid accepted plan followed by the plan-only diagnostic stop.');
            process.exit(2);
          }
          if (taskStarts.length !== 0) {
            console.error(`Plan-only diagnostic unexpectedly started ${taskStarts.length} task(s).`);
            process.exit(3);
          }
          const taskCount = accepted.plan?.tasks?.length ?? 0;
          if (taskCount > 3) {
            console.error(`Fast plan unexpectedly contains ${taskCount} tasks.`);
            process.exit(4);
          }
          const output = {
            diagnostic: 'plan_only',
            taskCount,
            plan: accepted.plan,
            routes: accepted.routes ?? [],
            taskStarts: 0,
          };
          fs.writeFileSync(path.join(process.env.SMOKE_OUTPUT, 'plan-diagnostic.json'), `${JSON.stringify(output, null, 2)}\n`);
          console.log(`Plan-only diagnostic accepted ${taskCount} task(s) and started no workers.`);
          NODE

      - name: Summarize auto-smoke efficiency
        if: always() && steps.auto-smoke.outputs.enabled == 'true'
        continue-on-error: true
        shell: bash
        env:
          SMOKE_OUTPUT: ${{ runner.temp }}/convergent-auto-smoke
        run: |
          events="$(find "${SMOKE_OUTPUT}/audit" -name events.jsonl -type f 2>/dev/null | head -n 1)"
          if [[ -n "${events}" ]]; then
            node src/headless/efficiency-summary.js "${events}" "${SMOKE_OUTPUT}/efficiency-summary.json" > "${SMOKE_OUTPUT}/efficiency-summary.log"
          else
            echo "No trajectory events available." > "${SMOKE_OUTPUT}/efficiency-summary.log"
          fi

      - name: Independently validate auto-smoke target
        if: always() && steps.auto-smoke.outputs.enabled == 'true'
        continue-on-error: true
        shell: bash
        env:
          SMOKE_OUTPUT: ${{ runner.temp }}/convergent-auto-smoke
        run: |
          mkdir -p "${SMOKE_OUTPUT}"
          set -o pipefail
          (
            cd auto-smoke-target
            python3 -B -m unittest discover -s tests -v
          ) 2>&1 | tee "${SMOKE_OUTPUT}/target-validation.log"

      - name: Capture final auto-smoke workspace
        if: always() && steps.auto-smoke.outputs.enabled == 'true'
        shell: bash
        env:
          SMOKE_OUTPUT: ${{ runner.temp }}/convergent-auto-smoke
        run: |
          mkdir -p "${SMOKE_OUTPUT}"
          git -C auto-smoke-target status --porcelain=v1 --untracked-files=all > "${SMOKE_OUTPUT}/final-status.txt" || true
          git -C auto-smoke-target diff --binary --no-ext-diff > "${SMOKE_OUTPUT}/final-diff.patch" || true
          tar --exclude=.git -czf "${SMOKE_OUTPUT}/workspace.tar.gz" -C auto-smoke-target .

      - name: Upload auto-smoke evidence
        if: always() && steps.auto-smoke.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: convergent-auto-smoke-${{ github.run_number }}
          path: ${{ runner.temp }}/convergent-auto-smoke
          if-no-files-found: warn
          retention-days: 7

  package-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - name: Run Windows tests
        id: windows-tests
        shell: pwsh
        run: |
          npm test 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/windows-test.log"
          exit $LASTEXITCODE
      - name: Upload Windows test failure
        if: always() && steps.windows-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-failure-${{ github.run_number }}
          path: ${{ runner.temp }}/windows-test.log
          if-no-files-found: error
          retention-days: 3
      - run: npm run check
      - name: Verify Windows x64 Copilot runtime dependency
        shell: pwsh
        run: |
          if (-not (Test-Path 'node_modules/@github/copilot-win32-x64')) {
            throw 'npm ci did not install @github/copilot-win32-x64 on the Windows x64 runner.'
          }
          if (Test-Path 'node_modules/@github/copilot-linux-x64') {
            throw 'Linux Copilot runtime unexpectedly present in the Windows x64 install.'
          }
      - name: Package Windows x64 VSIX
        shell: pwsh
        run: npm run package -- --out "$env:RUNNER_TEMP/convergent-win32-x64.vsix"
      - name: Verify Windows x64 VSIX payload
        shell: pwsh
        run: |
          $vsix = "$env:RUNNER_TEMP/convergent-win32-x64.vsix"
          $zip = "$env:RUNNER_TEMP/convergent-win32-x64.zip"
          $expanded = "$env:RUNNER_TEMP/convergent-win32-x64-expanded"
          Copy-Item $vsix $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $expanded
          $manifest = Get-Content -Raw (Join-Path $expanded 'extension.vsixmanifest')
          if ($manifest -notmatch 'TargetPlatform="win32-x64"') {
            throw 'VSIX manifest does not declare TargetPlatform="win32-x64".'
          }
          if (-not (Test-Path (Join-Path $expanded 'extension/node_modules/@github/copilot-win32-x64'))) {
            throw 'Windows Copilot runtime is missing from the Windows VSIX.'
          }
          if (Test-Path (Join-Path $expanded 'extension/node_modules/@github/copilot-linux-x64')) {
            throw 'Linux Copilot runtime unexpectedly packaged in Windows VSIX.'
          }
