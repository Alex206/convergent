name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm run check

      - name: Detect bounded Scenario 05 request
        id: benchmark
        if: >-
          github.event_name == 'pull_request' &&
          contains(github.event.pull_request.labels.*.name, 'headless-benchmark')
        shell: bash
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          BENCHMARK_REPO_TOKEN: ${{ secrets.BENCHMARK_REPO_TOKEN }}
        run: |
          test -n "${COPILOT_GITHUB_TOKEN}" || { echo 'COPILOT_GITHUB_TOKEN is required.' >&2; exit 2; }
          test -n "${BENCHMARK_REPO_TOKEN}" || { echo 'BENCHMARK_REPO_TOKEN is required.' >&2; exit 2; }
          echo 'enabled=true' >> "${GITHUB_OUTPUT}"

      - name: Checkout benchmark target
        if: steps.benchmark.outputs.enabled == 'true'
        uses: actions/checkout@v6
        with:
          repository: Alex206/convergent-test-repo
          ref: main
          path: benchmark-target
          token: ${{ secrets.BENCHMARK_REPO_TOKEN }}

      - name: Create pre-existing user workspace state
        if: steps.benchmark.outputs.enabled == 'true'
        shell: bash
        run: |
          mkdir -p benchmark-target/.vscode
          printf '%s\n' '{"files.trimTrailingWhitespace":true}' > benchmark-target/.vscode/settings.json
          printf '%s\n' 'local benchmark note' > benchmark-target/notes.local
          test "$(cat benchmark-target/.vscode/settings.json)" = '{"files.trimTrailingWhitespace":true}'
          test "$(cat benchmark-target/notes.local)" = 'local benchmark note'
          git -C benchmark-target status --short --untracked-files=all
          git -C benchmark-target check-ignore -q notes.local

      - name: Run bounded Pro Scenario 05 workspace benchmark
        id: scenario05
        if: steps.benchmark.outputs.enabled == 'true'
        timeout-minutes: 9
        shell: bash
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          COPILOT_PLUGIN_DIR_ONLY: 'true'
          CONVERGENT_HEADLESS_ANSWERS_JSON: '[]'
          BENCHMARK_OUTPUT: ${{ runner.temp }}/convergent-pro-scenario05
        run: |
          set -o pipefail
          mkdir -p "${BENCHMARK_OUTPUT}"
          node - <<'NODE' > "${BENCHMARK_OUTPUT}/runtime-versions.json"
          const { runtimeVersionInfo } = require('./src/copilot/version-info');
          process.stdout.write(`${JSON.stringify(runtimeVersionInfo(), null, 2)}\n`);
          NODE
          node src/headless/cli.js \
            --workspace "${GITHUB_WORKSPACE}/benchmark-target" \
            --prompt-file "${GITHUB_WORKSPACE}/benchmark-target/benchmarks/05-preexisting-workspace-state.md" \
            --output-dir "${BENCHMARK_OUTPUT}" \
            --flow fast \
            --audit-level full \
            --limit-policy pause \
            --max-model-calls 36 \
            --max-model-calls-per-turn 10 \
            --max-chat-requests 12 \
            --max-ai-credits 35 \
            2>&1 | tee "${BENCHMARK_OUTPUT}/runner.log"

      - name: Summarize Scenario 05 efficiency
        if: always() && steps.benchmark.outputs.enabled == 'true'
        continue-on-error: true
        shell: bash
        env:
          BENCHMARK_OUTPUT: ${{ runner.temp }}/convergent-pro-scenario05
        run: |
          events="$(find "${BENCHMARK_OUTPUT}/audit" -name events.jsonl -type f 2>/dev/null | head -n 1)"
          if [[ -n "${events}" ]]; then
            node src/headless/efficiency-summary.js "${events}" "${BENCHMARK_OUTPUT}/efficiency-summary.json" > "${BENCHMARK_OUTPUT}/efficiency-summary.log"
          fi

      - name: Independently validate Scenario 05 behavior and protected state
        id: acceptance
        if: always() && steps.benchmark.outputs.enabled == 'true'
        continue-on-error: true
        shell: bash
        env:
          BENCHMARK_OUTPUT: ${{ runner.temp }}/convergent-pro-scenario05
        run: |
          set -o pipefail
          (
            cd benchmark-target
            python3 -B -m unittest discover -s tests -v
          ) 2>&1 | tee "${BENCHMARK_OUTPUT}/target-validation.log"
          node src/headless/scenario05-acceptance.js \
            "${GITHUB_WORKSPACE}/benchmark-target" \
            "${BENCHMARK_OUTPUT}/scenario05-acceptance.json"

      - name: Capture final Scenario 05 workspace
        if: always() && steps.benchmark.outputs.enabled == 'true'
        shell: bash
        env:
          BENCHMARK_OUTPUT: ${{ runner.temp }}/convergent-pro-scenario05
        run: |
          git -C benchmark-target status --porcelain=v1 --untracked-files=all > "${BENCHMARK_OUTPUT}/final-status.txt" || true
          git -C benchmark-target diff --binary --no-ext-diff > "${BENCHMARK_OUTPUT}/final-diff.patch" || true
          printf 'settings-sha256=' > "${BENCHMARK_OUTPUT}/protected-state.sha256"
          sha256sum benchmark-target/.vscode/settings.json >> "${BENCHMARK_OUTPUT}/protected-state.sha256"
          printf 'note-sha256=' >> "${BENCHMARK_OUTPUT}/protected-state.sha256"
          sha256sum benchmark-target/notes.local >> "${BENCHMARK_OUTPUT}/protected-state.sha256"
          tar --exclude=.git -czf "${BENCHMARK_OUTPUT}/workspace.tar.gz" -C benchmark-target .

      - name: Upload bounded Scenario 05 evidence
        if: always() && steps.benchmark.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: convergent-pro-scenario05-${{ github.run_number }}
          path: ${{ runner.temp }}/convergent-pro-scenario05
          if-no-files-found: error
          retention-days: 14

      - name: Require completed accepted Scenario 05
        if: always() && steps.benchmark.outputs.enabled == 'true'
        shell: bash
        env:
          BENCHMARK_OUTPUT: ${{ runner.temp }}/convergent-pro-scenario05
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = process.env.BENCHMARK_OUTPUT;
          const result = JSON.parse(fs.readFileSync(path.join(root, 'result.json'), 'utf8'));
          const acceptance = JSON.parse(fs.readFileSync(path.join(root, 'scenario05-acceptance.json'), 'utf8'));
          if (result.status !== 'complete') {
            console.error(`Convergent Scenario 05 status is ${result.status}: ${result.error ?? 'no error'}`);
            process.exit(2);
          }
          if (!acceptance.ok) {
            console.error('Scenario 05 deterministic workspace-state acceptance failed.');
            process.exit(3);
          }
          console.log('Bounded Pro Scenario 05 completed while preserving pre-existing user workspace state.');
          NODE
