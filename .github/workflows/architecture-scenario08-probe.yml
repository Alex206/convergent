name: Temporary Scenario 08 High-Risk Architecture Probe

on:
  pull_request:
    types:
      - synchronize

jobs:
  compare:
    if: github.event.pull_request.head.ref == 'agent/architecture-benchmark-matrix'
    runs-on: ubuntu-latest
    timeout-minutes: 28
    permissions:
      contents: read
    env:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      COPILOT_PLUGIN_DIR_ONLY: 'true'
      BENCHMARK_REPO_TOKEN: ${{ secrets.BENCHMARK_REPO_TOKEN }}
      TARGET_SHA: 25de9ede2ea17e8e7e212ce057ff8e378fa81264
      OUTPUT_ROOT: /tmp/scenario08-architecture
      CONVERGENT_HEADLESS_ANSWERS_JSON: '[]'
    steps:
      - name: Require benchmark credentials
        shell: bash
        run: |
          test -n "${COPILOT_GITHUB_TOKEN}" || exit 2
          test -n "${BENCHMARK_REPO_TOKEN}" || exit 2
      - name: Checkout Convergent
        uses: actions/checkout@v6
      - name: Checkout economical fixture
        uses: actions/checkout@v6
        with:
          repository: Alex206/convergent-test-repo
          ref: ${{ env.TARGET_SHA }}
          path: target-economical
          token: ${{ secrets.BENCHMARK_REPO_TOKEN }}
      - name: Checkout peer fixture
        uses: actions/checkout@v6
        with:
          repository: Alex206/convergent-test-repo
          ref: ${{ env.TARGET_SHA }}
          path: target-peer
          token: ${{ secrets.BENCHMARK_REPO_TOKEN }}
      - name: Checkout v0.2 fixture
        uses: actions/checkout@v6
        with:
          repository: Alex206/convergent-test-repo
          ref: ${{ env.TARGET_SHA }}
          path: target-v02
          token: ${{ secrets.BENCHMARK_REPO_TOKEN }}
      - name: Verify seeded security bug and green baseline tests
        shell: bash
        run: |
          for target in target-economical target-peer target-v02; do
            (cd "${target}" && python3 -B -m unittest discover -s tests -v) > "/tmp/${target}-baseline-tests.log" 2>&1
            TARGET="${target}" python3 - <<'PY'
          import os, sys, tempfile
          from pathlib import Path
          sys.path.insert(0, os.environ['TARGET'])
          from taskflow import resolve_artifact_path
          with tempfile.TemporaryDirectory() as tmp:
              base = Path(tmp)
              root = base / 'work'
              sibling = base / 'work-shadow'
              root.mkdir(); sibling.mkdir()
              escaped = resolve_artifact_path(root, '../work-shadow/leak.txt')
              if escaped != (sibling / 'leak.txt').resolve():
                  raise SystemExit(f'fixture no longer reproduces sibling-prefix escape: {escaped!r}')
              inside_absolute = (root / 'inside.txt').resolve()
              if resolve_artifact_path(root, str(inside_absolute)) != inside_absolute:
                  raise SystemExit('fixture no longer reproduces absolute-path acceptance')
              if resolve_artifact_path(root, '.') != root.resolve():
                  raise SystemExit('fixture no longer reproduces root-self acceptance')
              link = root / 'link'
              try:
                  link.symlink_to(sibling, target_is_directory=True)
              except (OSError, NotImplementedError):
                  pass
              else:
                  symlink_escape = resolve_artifact_path(root, 'link/secret.txt')
                  if symlink_escape != (sibling / 'secret.txt').resolve():
                      raise SystemExit(f'fixture no longer reproduces symlink prefix escape: {symlink_escape!r}')
          print('seeded path-containment vulnerabilities reproduced')
          PY
          done
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci

      - name: Run economical Luna implementer plus Terra reviewer
        id: economical
        continue-on-error: true
        timeout-minutes: 7
        shell: bash
        run: |
          mkdir -p "${OUTPUT_ROOT}/economical-a1"
          set +e
          node src/headless/architecture-cli.js \
            --workspace "${GITHUB_WORKSPACE}/target-economical" \
            --prompt-file "${GITHUB_WORKSPACE}/target-economical/benchmarks/08-artifact-path-containment.md" \
            --output-dir "${OUTPUT_ROOT}/economical-a1" \
            --architecture implementer-reviewer \
            --recovery-policy strong-coordinator \
            --flow fast \
            --worker-a balanced-a \
            --reviewer strong \
            --experimental-route high_risk \
            --experimental-risk high \
            --audit-level full \
            --limit-policy pause \
            --max-model-calls 42 \
            --max-model-calls-per-turn 10 \
            --max-chat-requests 14 \
            --max-ai-credits 0 \
            2>&1 | tee "${OUTPUT_ROOT}/economical-a1/runner.log"
          code=${PIPESTATUS[0]}
          printf '{"runExit":%s}\n' "${code}" > "${OUTPUT_ROOT}/economical-a1/arm-status.json"
          exit "${code}"

      - name: Run economical peer convergence plus Terra reviewer
        id: peer
        continue-on-error: true
        timeout-minutes: 8
        shell: bash
        run: |
          mkdir -p "${OUTPUT_ROOT}/peer-reviewer"
          set +e
          node src/headless/architecture-cli.js \
            --workspace "${GITHUB_WORKSPACE}/target-peer" \
            --prompt-file "${GITHUB_WORKSPACE}/target-peer/benchmarks/08-artifact-path-containment.md" \
            --output-dir "${OUTPUT_ROOT}/peer-reviewer" \
            --architecture peer-competition-reviewer \
            --recovery-policy strong-coordinator \
            --flow fast \
            --worker-a balanced-a \
            --worker-b balanced-b \
            --reviewer strong \
            --experimental-route high_risk \
            --experimental-risk high \
            --audit-level full \
            --limit-policy pause \
            --max-model-calls 46 \
            --max-model-calls-per-turn 10 \
            --max-chat-requests 14 \
            --max-ai-credits 0 \
            2>&1 | tee "${OUTPUT_ROOT}/peer-reviewer/runner.log"
          code=${PIPESTATUS[0]}
          printf '{"runExit":%s}\n' "${code}" > "${OUTPUT_ROOT}/peer-reviewer/arm-status.json"
          exit "${code}"

      - name: Run released v0.2 reference
        id: v02
        continue-on-error: true
        timeout-minutes: 9
        shell: bash
        run: |
          mkdir -p "${OUTPUT_ROOT}/convergent-v02"
          set +e
          node src/headless/architecture-cli.js \
            --workspace "${GITHUB_WORKSPACE}/target-v02" \
            --prompt-file "${GITHUB_WORKSPACE}/target-v02/benchmarks/08-artifact-path-containment.md" \
            --output-dir "${OUTPUT_ROOT}/convergent-v02" \
            --architecture convergent-v02 \
            --flow fast \
            --coordinator strong \
            --worker-a adaptive \
            --worker-b adaptive-diverse \
            --reviewer strong \
            --audit-level full \
            --limit-policy pause \
            --max-model-calls 46 \
            --max-model-calls-per-turn 10 \
            --max-chat-requests 14 \
            --max-ai-credits 0 \
            2>&1 | tee "${OUTPUT_ROOT}/convergent-v02/runner.log"
          code=${PIPESTATUS[0]}
          printf '{"runExit":%s}\n' "${code}" > "${OUTPUT_ROOT}/convergent-v02/arm-status.json"
          exit "${code}"

      - name: Run independent Scenario 08 security oracle
        if: always()
        shell: bash
        run: |
          set +e
          for pair in "economical-a1 target-economical" "peer-reviewer target-peer" "convergent-v02 target-v02"; do
            set -- ${pair}; arm="$1"; target="$2"; out="${OUTPUT_ROOT}/${arm}"
            TARGET="${GITHUB_WORKSPACE}/${target}" OUTPUT="${out}/scenario08-acceptance.json" python3 - <<'PY'
          import json, os, subprocess, sys
          root = os.environ['TARGET']
          probe = r'''
          import json, tempfile, sys
          from pathlib import Path
          from taskflow import resolve_artifact_path
          result = {"checks": []}
          def check(name, fn):
              try:
                  fn(); result["checks"].append({"name": name, "ok": True})
              except Exception as exc:
                  result["checks"].append({"name": name, "ok": False, "error": f"{type(exc).__name__}: {exc}"})
          def reject(root, value):
              try: resolve_artifact_path(root, value)
              except ValueError: return
              raise AssertionError(f"expected ValueError for {value!r}")
          with tempfile.TemporaryDirectory() as tmp:
              base = Path(tmp)
              artifact_root = base / "work"
              prefix_sibling = base / "work-shadow"
              outside = base / "outside"
              artifact_root.mkdir(); prefix_sibling.mkdir(); outside.mkdir()
              nested = artifact_root / "reports"
              nested.mkdir()
              def happy_and_canonical():
                  expected = (artifact_root / "result.json").resolve()
                  assert resolve_artifact_path(artifact_root, "reports/../result.json") == expected
                  assert resolve_artifact_path(artifact_root, "reports/data.json") == (nested / "data.json").resolve()
              def sibling_prefix_escape():
                  reject(artifact_root, "../work-shadow/leak.txt")
                  reject(artifact_root, "../outside/leak.txt")
              def absolute_paths():
                  reject(artifact_root, str((artifact_root / "inside.txt").resolve()))
                  reject(artifact_root, str((outside / "outside.txt").resolve()))
              def strict_descendant():
                  for value in (".", "reports/..", "./reports/../."):
                      reject(artifact_root, value)
              def invalid_values():
                  for value in ("", None, 7):
                      reject(artifact_root, value)
              def symlink_boundary():
                  inside_dir = artifact_root / "inside-target"
                  inside_dir.mkdir()
                  inside_link = artifact_root / "inside-link"
                  outside_link = artifact_root / "outside-link"
                  prefix_link = artifact_root / "prefix-link"
                  try:
                      inside_link.symlink_to(inside_dir, target_is_directory=True)
                      outside_link.symlink_to(outside, target_is_directory=True)
                      prefix_link.symlink_to(prefix_sibling, target_is_directory=True)
                  except (OSError, NotImplementedError) as exc:
                      result["checks"].append({"name": "symlink setup supported", "ok": True, "skipped": str(exc)})
                      return
                  assert resolve_artifact_path(artifact_root, "inside-link/ok.txt") == (inside_dir / "ok.txt").resolve()
                  reject(artifact_root, "outside-link/escape.txt")
                  reject(artifact_root, "prefix-link/escape.txt")
              check("valid and normalized in-root paths resolve canonically", happy_and_canonical)
              check("parent and sibling-prefix traversal are rejected", sibling_prefix_escape)
              check("absolute paths are rejected even when inside root", absolute_paths)
              check("resolved root itself is rejected; result must be a strict descendant", strict_descendant)
              check("empty and non-string artifact paths preserve ValueError contract", invalid_values)
              check("symlinks may resolve inside root but cannot escape it", symlink_boundary)
          result["ok"] = all(c["ok"] for c in result["checks"])
          print(json.dumps(result)); sys.exit(0 if result["ok"] else 1)
          '''
          completed = subprocess.run([sys.executable, '-B', '-c', probe], cwd=root, text=True, capture_output=True)
          try: behavior = json.loads(completed.stdout.strip() or '{}')
          except Exception: behavior = {"ok": False, "checks": [], "parseError": completed.stdout, "stderr": completed.stderr}
          tests = subprocess.run([sys.executable, '-B', '-m', 'unittest', 'discover', '-s', 'tests', '-v'], cwd=root, text=True, capture_output=True)
          report = {"ok": bool(behavior.get("ok")) and tests.returncode == 0, "behavior": behavior, "unitTestsExit": tests.returncode, "unitTestsTail": (tests.stdout + tests.stderr)[-6000:]}
          with open(os.environ['OUTPUT'], 'w', encoding='utf8') as f: json.dump(report, f, indent=2); f.write('\n')
          sys.exit(0 if report["ok"] else 1)
          PY
            events="$(find "${out}/audit" -name events.jsonl -type f 2>/dev/null | head -n 1)"
            if [[ -n "${events}" ]]; then node src/headless/efficiency-summary.js "${events}" "${out}/efficiency-summary.json" > "${out}/efficiency-summary.log" 2>&1 || true; fi
          done
          exit 0

      - name: Build compact comparison
        if: always()
        shell: bash
        run: |
          OUTPUT_ROOT="${OUTPUT_ROOT}" node - <<'NODE' | tee "${OUTPUT_ROOT}/summary.log"
          const fs = require('node:fs'); const path = require('node:path'); const root = process.env.OUTPUT_ROOT;
          const runs = ['economical-a1', 'peer-reviewer', 'convergent-v02'].map((arm) => {
            const result = JSON.parse(fs.readFileSync(path.join(root, arm, 'result.json'), 'utf8'));
            const acceptance = JSON.parse(fs.readFileSync(path.join(root, arm, 'scenario08-acceptance.json'), 'utf8'));
            const status = JSON.parse(fs.readFileSync(path.join(root, arm, 'arm-status.json'), 'utf8'));
            return { arm, architecture: result.architecture?.id, runStatus: result.status, runExit: status.runExit, oraclePass: acceptance.ok === true, oracleChecksPassed: (acceptance.behavior?.checks ?? []).filter((x) => x.ok).length, oracleChecksTotal: (acceptance.behavior?.checks ?? []).length, usage: result.usage, actualRoleModels: result.actualRoleModels, stats: result.stats, error: result.error };
          });
          const summary = { targetSha: process.env.TARGET_SHA, scenario: 8, runs }; fs.writeFileSync(path.join(root, 'summary.json'), JSON.stringify(summary, null, 2) + '\n'); console.log(JSON.stringify(summary, null, 2));
          NODE

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario08-high-risk-${{ github.run_number }}
          path: /tmp/scenario08-architecture
          if-no-files-found: error
          retention-days: 14

      - name: Report result
        if: always()
        shell: bash
        run: |
          SUMMARY="${OUTPUT_ROOT}/summary.json" node - <<'NODE'
          const fs = require('node:fs'); const data = JSON.parse(fs.readFileSync(process.env.SUMMARY, 'utf8'));
          for (const r of data.runs ?? []) console.log(`${r.arm}: status=${r.runStatus} oracle=${r.oraclePass} checks=${r.oracleChecksPassed}/${r.oracleChecksTotal} calls=${r.usage?.calls} credits=${r.usage?.aiCredits} input=${r.usage?.inputTokens} elapsedMs=${r.usage?.elapsedMs}`);
          if ((data.runs ?? []).length !== 3) process.exit(1);
          NODE
