name: Temporary Scenario 04 Architecture Probe

on:
  pull_request:
    types:
      - synchronize

jobs:
  compare:
    if: github.event.pull_request.head.ref == 'agent/architecture-benchmark-matrix'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      COPILOT_PLUGIN_DIR_ONLY: 'true'
      BENCHMARK_REPO_TOKEN: ${{ secrets.BENCHMARK_REPO_TOKEN }}
      TARGET_SHA: 1f38b2606f306ef4902d6159e8c9b7f3d8fe9aef
      OUTPUT_ROOT: ${{ runner.temp }}/scenario04-architecture
      CONVERGENT_HEADLESS_ANSWERS_JSON: '["Operator context: Use TASKFLOW_RELEASE_TOKEN=benchmark-only-secret only for the external validation command; do not persist it or modify tools/validate_release_signature.py, then retry the blocked pass.","Operator context: Use TASKFLOW_RELEASE_TOKEN=benchmark-only-secret only for the external validation command; do not persist it or modify tools/validate_release_signature.py, then retry the blocked pass.","Operator context: Use TASKFLOW_RELEASE_TOKEN=benchmark-only-secret only for the external validation command; do not persist it or modify tools/validate_release_signature.py, then retry the blocked pass."]'
    steps:
      - name: Require benchmark credentials
        shell: bash
        run: |
          test -n "${COPILOT_GITHUB_TOKEN}" || { echo 'COPILOT_GITHUB_TOKEN is required.' >&2; exit 2; }
          test -n "${BENCHMARK_REPO_TOKEN}" || { echo 'BENCHMARK_REPO_TOKEN is required.' >&2; exit 2; }

      - name: Checkout Convergent
        uses: actions/checkout@v6

      - name: Checkout cheap-arm target
        uses: actions/checkout@v6
        with:
          repository: Alex206/convergent-test-repo
          ref: ${{ env.TARGET_SHA }}
          path: target-implementer-reviewer
          token: ${{ secrets.BENCHMARK_REPO_TOKEN }}

      - name: Checkout v0.2 target
        uses: actions/checkout@v6
        with:
          repository: Alex206/convergent-test-repo
          ref: ${{ env.TARGET_SHA }}
          path: target-v02
          token: ${{ secrets.BENCHMARK_REPO_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run implementer-reviewer plus conditional recovery
        id: cheap
        continue-on-error: true
        timeout-minutes: 7
        shell: bash
        run: |
          mkdir -p "${OUTPUT_ROOT}/implementer-reviewer"
          set +e
          node src/headless/architecture-cli.js \
            --workspace "${GITHUB_WORKSPACE}/target-implementer-reviewer" \
            --prompt-file "${GITHUB_WORKSPACE}/target-implementer-reviewer/benchmarks/04-blocked-external-validation.md" \
            --output-dir "${OUTPUT_ROOT}/implementer-reviewer" \
            --architecture implementer-reviewer \
            --recovery-policy strong-coordinator \
            --flow fast \
            --coordinator strong \
            --worker-a strong \
            --reviewer strong \
            --audit-level full \
            --limit-policy pause \
            --max-model-calls 40 \
            --max-model-calls-per-turn 10 \
            --max-chat-requests 12 \
            --max-ai-credits 0 \
            2>&1 | tee "${OUTPUT_ROOT}/implementer-reviewer/runner.log"
          code=${PIPESTATUS[0]}
          printf '{"runExit":%s}\n' "${code}" > "${OUTPUT_ROOT}/implementer-reviewer/arm-status.json"
          exit "${code}"

      - name: Run released v0.2 reference architecture
        id: v02
        continue-on-error: true
        timeout-minutes: 7
        shell: bash
        run: |
          mkdir -p "${OUTPUT_ROOT}/convergent-v02"
          set +e
          node src/headless/architecture-cli.js \
            --workspace "${GITHUB_WORKSPACE}/target-v02" \
            --prompt-file "${GITHUB_WORKSPACE}/target-v02/benchmarks/04-blocked-external-validation.md" \
            --output-dir "${OUTPUT_ROOT}/convergent-v02" \
            --architecture convergent-v02 \
            --recovery-policy strong-coordinator \
            --flow fast \
            --coordinator strong \
            --worker-a adaptive \
            --worker-b adaptive-diverse \
            --reviewer strong \
            --audit-level full \
            --limit-policy pause \
            --max-model-calls 40 \
            --max-model-calls-per-turn 10 \
            --max-chat-requests 12 \
            --max-ai-credits 0 \
            2>&1 | tee "${OUTPUT_ROOT}/convergent-v02/runner.log"
          code=${PIPESTATUS[0]}
          printf '{"runExit":%s}\n' "${code}" > "${OUTPUT_ROOT}/convergent-v02/arm-status.json"
          exit "${code}"

      - name: Run deterministic acceptance oracles
        if: always()
        shell: bash
        run: |
          set +e
          for pair in \
            "implementer-reviewer target-implementer-reviewer" \
            "convergent-v02 target-v02"; do
            set -- ${pair}
            arm="$1"
            target="$2"
            out="${OUTPUT_ROOT}/${arm}"
            events="$(find "${out}/audit" -name events.jsonl -type f 2>/dev/null | head -n 1)"
            if [[ -n "${events}" ]]; then
              node src/headless/scenario04-acceptance.js \
                "${GITHUB_WORKSPACE}/${target}" \
                "${events}" \
                "${out}/scenario04-architecture-acceptance.json" \
                > "${out}/acceptance.log" 2>&1
            else
              printf '%s\n' '{"ok":false,"workspace":{"checks":[]},"recovery":{"checks":[]},"error":"no trajectory events"}' > "${out}/scenario04-architecture-acceptance.json"
            fi
            node src/headless/efficiency-summary.js "${events}" "${out}/efficiency-summary.json" > "${out}/efficiency-summary.log" 2>&1 || true
            (cd "${GITHUB_WORKSPACE}/${target}" && python3 -B -m unittest discover -s tests -v) > "${out}/target-validation.log" 2>&1 || true
          done

      - name: Build normalized comparison
        if: always()
        shell: bash
        run: |
          node src/headless/architecture-summary.js \
            "${OUTPUT_ROOT}/summary.json" \
            "${OUTPUT_ROOT}/summary.csv" \
            "${OUTPUT_ROOT}/implementer-reviewer" \
            "${OUTPUT_ROOT}/convergent-v02" \
            | tee "${OUTPUT_ROOT}/summary.log"

      - name: Upload comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario04-architecture-guarded-${{ github.run_number }}
          path: ${{ runner.temp }}/scenario04-architecture
          if-no-files-found: error
          retention-days: 14

      - name: Require both architecture oracles
        if: always()
        shell: bash
        run: |
          SUMMARY="${OUTPUT_ROOT}/summary.json" node - <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync(process.env.SUMMARY, 'utf8'));
          for (const run of data.runs ?? []) {
            console.log(`${run.architecture}: status=${run.runStatus} oracle=${run.oraclePass} calls=${run.modelCalls} credits=${run.aiCredits} input=${run.inputTokens} elapsedMs=${run.elapsedMs}`);
          }
          if ((data.runs ?? []).length !== 2 || data.runs.some((run) => run.runStatus !== 'complete' || run.oraclePass !== true)) {
            process.exit(1);
          }
          NODE
